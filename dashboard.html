<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HALINA BISTRO CAFE - Owner Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .header {
      background: #111;
      color: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
    }

    .header p {
      margin: 4px 0 0;
      color: #aaa;
      font-size: 13px;
    }

    .logout-btn {
      display: none;
      border: none;
      background: white;
      color: #111;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-box {
      max-width: 400px;
      margin: 70px auto;
      padding: 30px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    .login-box h2 {
      margin-top: 0;
    }

    .input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: .6;
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      color: #d00;
      line-height: 1.5;
    }

    .success {
      color: #16803c;
    }

    .dashboard {
      display: none;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .restaurant-title {
      margin-bottom: 20px;
    }

    .restaurant-title h2 {
      margin: 0;
    }

    .restaurant-title p {
      color: #777;
      margin-top: 5px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 15px rgba(0,0,0,.05);
    }

    .card-title {
      color: #777;
      font-size: 13px;
    }

    .card-value {
      font-size: 27px;
      font-weight: bold;
      margin-top: 8px;
    }

    .orders-section {
      margin-top: 25px;
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.05);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .refresh-btn {
      border: none;
      background: #111;
      color: white;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    .order {
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .order:last-child {
      border-bottom: none;
    }

    .order-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .order-number {
      font-weight: bold;
    }

    .status {
      background: #eee;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .order-details {
      margin-top: 7px;
      color: #666;
      font-size: 14px;
      line-height: 1.6;
    }

    .order-total {
      margin-top: 7px;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      padding: 30px 0;
      color: #888;
    }

    @media (max-width: 800px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .container {
        padding: 12px;
      }

      .cards {
        gap: 10px;
      }

      .card {
        padding: 15px;
      }

      .card-value {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="header">

    <div>
      <h1>HALINA BISTRO CAFE</h1>
      <p>Owner Dashboard</p>
    </div>

    <button
      id="logoutBtn"
      class="logout-btn"
      onclick="logout()">
      Logout
    </button>

  </div>


  <!-- LOGIN -->

  <div id="loginBox" class="login-box">

    <h2>Owner Login</h2>

    <p>
      Login to manage your restaurant.
    </p>

    <input
      id="email"
      class="input"
      type="email"
      autocomplete="email"
      placeholder="Email">

    <input
      id="password"
      class="input"
      type="password"
      autocomplete="current-password"
      placeholder="Password">

    <button
      id="loginBtn"
      class="login-btn"
      onclick="login()">
      Login
    </button>

    <div
      id="loginMessage"
      class="message">
    </div>

  </div>


  <!-- DASHBOARD -->

  <div id="dashboard" class="dashboard">

    <div class="container">

      <div class="restaurant-title">

        <h2 id="restaurantName">
          HALINA BISTRO CAFE
        </h2>

        <p>
          Restaurant Owner Dashboard
        </p>

      </div>


      <div class="cards">

        <div class="card">
          <div class="card-title">
            Orders Today
          </div>

          <div
            id="ordersToday"
            class="card-value">
            0
          </div>
        </div>


        <div class="card">
          <div class="card-title">
            Sales Today
          </div>

          <div
            id="salesToday"
            class="card-value">
            ₱0
          </div>
        </div>


        <div class="card">
          <div class="card-title">
            New Orders
          </div>

          <div
            id="newOrders"
            class="card-value">
            0
          </div>
        </div>


        <div class="card">
          <div class="card-title">
            Preparing
          </div>

          <div
            id="preparingOrders"
            class="card-value">
            0
          </div>
        </div>

      </div>


      <div class="orders-section">

        <div class="section-header">

          <h3>
            Recent Orders
          </h3>

          <button
            class="refresh-btn"
            onclick="loadOrders()">
            Refresh
          </button>

        </div>

        <div id="ordersList">
          Loading orders...
        </div>

      </div>

    </div>

  </div>


  <script>

    /* =================================
       SUPABASE
    ================================= */

    const SUPABASE_URL =
      "https://isqcuycjrbjtmqhzckvb.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_PM2N85UZqFZqc-2XQ04IPg_ulOxQkt4";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let currentRestaurantId = null;


    /* =================================
       LOGIN
    ================================= */

    async function login() {

      const email =
        document.getElementById("email")
          .value
          .trim();

      const password =
        document.getElementById("password")
          .value;

      const message =
        document.getElementById("loginMessage");

      const button =
        document.getElementById("loginBtn");


      message.textContent = "";
      message.className = "message";


      if (!email || !password) {

        message.textContent =
          "Please enter your email and password.";

        return;

      }


      button.disabled = true;
      button.textContent = "Logging in...";


      try {

        const result =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (result.error) {

          throw result.error;

        }


        message.textContent =
          "Login successful. Loading dashboard...";

        message.className =
          "message success";


        await startDashboard();


      } catch (error) {

        console.error(
          "LOGIN ERROR:",
          error
        );

        message.textContent =
          error.message ||
          "Login failed.";


        button.disabled = false;
        button.textContent = "Login";

      }

    }


    /* =================================
       START DASHBOARD
    ================================= */

    async function startDashboard() {

      const {
        data: {
          user
        }
      } =
        await supabaseClient.auth.getUser();


      if (!user) {

        showLogin();

        return;

      }


      console.log(
        "Logged in user:",
        user.email
      );


      const result =
        await supabaseClient

          .from("restaurant_users")

          .select(`
            restaurant_id,
            role,
            restaurants (
              name,
              slug,
              currency,
              timezone
            )
          `)

          .eq(
            "user_id",
            user.id
          )

          .maybeSingle();


      if (result.error) {

        console.error(
          "RESTAURANT USER ERROR:",
          result.error
        );

        document.getElementById(
          "loginMessage"
        ).textContent =
          "Login worked, but the restaurant account could not be loaded: " +
          result.error.message;

        return;

      }


      if (!result.data) {

        document.getElementById(
          "loginMessage"
        ).textContent =
          "This account is not linked to a restaurant.";

        await supabaseClient.auth.signOut();

        return;

      }


      if (
        result.data.role !== "owner" &&
        result.data.role !== "staff" &&
        result.data.role !== "admin"
      ) {

        document.getElementById(
          "loginMessage"
        ).textContent =
          "This account does not have dashboard access.";

        return;

      }


      currentRestaurantId =
        result.data.restaurant_id;


      if (
        result.data.restaurants &&
        result.data.restaurants.name
      ) {

        document.getElementById(
          "restaurantName"
        ).textContent =
          result.data.restaurants.name;

      }


      document.getElementById(
        "loginBox"
      ).style.display =
        "none";


      document.getElementById(
        "dashboard"
      ).style.display =
        "block";


      document.getElementById(
        "logoutBtn"
      ).style.display =
        "block";


      await loadOrders();

    }


    /* =================================
       LOAD ORDERS
    ================================= */

    async function loadOrders() {

      if (!currentRestaurantId) {

        return;

      }


      const ordersList =
        document.getElementById(
          "ordersList"
        );


      ordersList.innerHTML =
        "Loading orders...";


      const result =
        await supabaseClient

          .from("orders")

          .select("*")

          .eq(
            "restaurant_id",
            currentRestaurantId
          )

          .order(
            "created_at",
            {
              ascending: false
            }
          )

          .limit(50);


      if (result.error) {

        console.error(
          "ORDERS ERROR:",
          result.error
        );

        ordersList.innerHTML =
          "Orders could not be loaded: " +
          result.error.message;

        return;

      }


      const orders =
        result.data || [];


      calculateDashboard(
        orders
      );

      renderOrders(
        orders
      );

    }


    /* =================================
       CALCULATE DASHBOARD
    ================================= */

    function calculateDashboard(
      orders
    ) {

      const now =
        new Date();


      const start =
        new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate()
        );


      const todayOrders =
        orders.filter(
          function(order) {

            if (!order.created_at) {

              return false;

            }

            return (
              new Date(
                order.created_at
              ) >= start
            );

          }
        );


      let sales = 0;


      todayOrders.forEach(
        function(order) {

          const status =
            String(
              order.order_status ||
              order.status ||
              ""
            ).toLowerCase();


          if (
            status !== "cancelled" &&
            status !== "canceled"
          ) {

            sales += Number(
              order.total || 0
            );

          }

        }
      );


      const newOrders =
        todayOrders.filter(
          function(order) {

            const status =
              String(
                order.order_status ||
                order.status ||
                ""
              ).toLowerCase();


            return (
              status === "new" ||
              status === "pending"
            );

          }
        );


      const preparing =
        todayOrders.filter(
          function(order) {

            const status =
              String(
                order.order_status ||
                order.status ||
                ""
              ).toLowerCase();


            return (
              status === "preparing" ||
              status === "processing"
            );

          }
        );


      document.getElementById(
        "ordersToday"
      ).textContent =
        todayOrders.length;


      document.getElementById(
        "salesToday"
      ).textContent =
        "₱" +
        sales.toLocaleString(
          "en-PH",
          {
            minimumFractionDigits: 2
          }
        );


      document.getElementById(
        "newOrders"
      ).textContent =
        newOrders.length;


      document.getElementById(
        "preparingOrders"
      ).textContent =
        preparing.length;

    }


    /* =================================
       RENDER ORDERS
    ================================= */

    function renderOrders(
      orders
    ) {

      const ordersList =
        document.getElementById(
          "ordersList"
        );


      if (!orders.length) {

        ordersList.innerHTML =
          `<div class="empty">
            No orders yet.
          </div>`;

        return;

      }


      ordersList.innerHTML = "";


      orders.forEach(
        function(order) {

          const number =
            order.order_number ||
            order.id ||
            "N/A";


          const customer =
            order.customer_name ||
            "Customer";


          const status =
            order.order_status ||
            order.status ||
            "Pending";


          const total =
            Number(
              order.total || 0
            );


          const table =
            order.table_number ||
            order.order_type ||
            "N/A";


          const date =
            order.created_at
              ? new Date(
                  order.created_at
                ).toLocaleString(
                  "en-PH"
                )
              : "";


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "order";


          div.innerHTML = `

            <div class="order-top">

              <div class="order-number">
                Order #${number}
              </div>

              <div class="status">
                ${status}
              </div>

            </div>

            <div class="order-details">

              Customer:
              ${customer}

              <br>

              Table / Type:
              ${table}

              <br>

              ${date}

            </div>

            <div class="order-total">

              Total:
              ₱${total.toLocaleString(
                "en-PH",
                {
                  minimumFractionDigits: 2
                }
              )}

            </div>

          `;


          ordersList.appendChild(
            div
          );

        }
      );

    }


    /* =================================
       LOGOUT
    ================================= */

    async function logout() {

      await supabaseClient.auth.signOut();

      currentRestaurantId = null;

      showLogin();

    }


    /* =================================
       SHOW LOGIN
    ================================= */

    function showLogin() {

      document.getElementById(
        "loginBox"
      ).style.display =
        "block";


      document.getElementById(
        "dashboard"
      ).style.display =
        "none";


      document.getElementById(
        "logoutBtn"
      ).style.display =
        "none";

    }


    /* =================================
       CHECK EXISTING SESSION
    ================================= */

    async function checkSession() {

      try {

        const result =
          await supabaseClient.auth.getSession();


        if (
          result.data &&
          result.data.session
        ) {

          await startDashboard();

        } else {

          showLogin();

        }

      } catch (error) {

        console.error(
          "SESSION ERROR:",
          error
        );

        showLogin();

      }

    }


    /* =================================
       START
    ================================= */

    checkSession();

  </script>

</body>
</html>
