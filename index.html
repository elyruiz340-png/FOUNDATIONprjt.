<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HALINAQR</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#f7f1e8;
  color:#2d2118;
}

.hero{
  height:220px;
  background:
    linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.35)),
    url("https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=1200&q=80");
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
}

.hero h1{
  font-size:42px;
  letter-spacing:4px;
}

.hero p{
  margin-top:8px;
  font-size:16px;
}

.table-box{
  width:90%;
  max-width:500px;
  background:white;
  margin:-35px auto 25px;
  position:relative;
  padding:18px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.12);
  text-align:center;
  font-weight:bold;
  font-size:20px;
}

.container{
  width:92%;
  max-width:600px;
  margin:auto;
}

.menu-card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  margin-bottom:18px;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
}

.menu-card img{
  width:100%;
  height:190px;
  object-fit:cover;
}

.menu-content{
  padding:16px;
}

.menu-content h3{
  font-size:21px;
  margin-bottom:5px;
}

.price{
  font-weight:bold;
  margin-bottom:12px;
}

.controls{
  display:flex;
  align-items:center;
  gap:15px;
}

.controls button{
  width:38px;
  height:38px;
  border:none;
  border-radius:50%;
  background:#2d2118;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.qty{
  font-size:18px;
  font-weight:bold;
}

.order-box{
  background:white;
  padding:20px;
  border-radius:15px;
  margin:25px 0;
  box-shadow:0 3px 12px rgba(0,0,0,.1);
}

.order-box h2{
  margin-bottom:15px;
}

.order-item{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

.total{
  border-top:1px solid #ddd;
  padding-top:12px;
  margin-top:12px;
  font-size:20px;
  font-weight:bold;
}

/* PAYMENT */

.payment-title{
  margin-top:24px;
  margin-bottom:12px;
  font-size:18px;
  font-weight:bold;
}

.payment-options{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.payment-option{
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid #ddd;
  padding:15px;
  border-radius:10px;
  cursor:pointer;
  background:#fff;
}

.payment-option:hover{
  background:#faf7f2;
}

.payment-option input{
  width:18px;
  height:18px;
  margin:0;
  flex-shrink:0;
}

/* QR */

#qrSection{
  display:none;
  text-align:center;
  margin-top:16px;
  padding:18px;
  background:#f7f1e8;
  border-radius:12px;
}

#qrcode{
  display:flex;
  justify-content:center;
  margin:15px 0;
}

.pay-button{
  background:#2d2118;
  color:white;
  border:none;
  padding:11px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

#paymentMessage{
  margin-top:10px;
  font-weight:bold;
}

/* SEND */

.send-button{
  width:100%;
  background:#238636;
  color:white;
  border:none;
  padding:15px;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-top:18px;
}

.send-button:disabled{
  opacity:.6;
}

/* SUCCESS */

.success{
  display:none;
  background:#e8f7ed;
  border:2px solid #238636;
  color:#176b2c;
  padding:18px;
  border-radius:12px;
  margin:20px 0;
  text-align:center;
}

.success h3{
  margin-bottom:7px;
}

/* ERROR */

.error{
  display:none;
  background:#fff0f0;
  border:2px solid #d93025;
  color:#a61b1b;
  padding:18px;
  border-radius:12px;
  margin:20px 0;
  text-align:center;
  white-space:pre-wrap;
}

@media(max-width:600px){

  .hero{
    height:190px;
  }

  .hero h1{
    font-size:34px;
  }

  .menu-card img{
    height:170px;
  }

}
</style>
</head>

<body>

<!-- HERO -->

<div class="hero">
  <div>
    <h1>HALINAQR</h1>
    <p>Scan • Order • Enjoy</p>
  </div>
</div>


<!-- TABLE -->

<div class="table-box">
  TABLE <span id="tableNumber">?</span>
</div>


<div class="container">


<!-- TERIYAKI -->

<div class="menu-card">

  <img src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80">

  <div class="menu-content">

    <h3>Teriyaki Chicken</h3>

    <div class="price">
      ₱120
    </div>

    <div class="controls">

      <button onclick="changeQty('teriyaki',-1)">
        −
      </button>

      <span class="qty" id="qty-teriyaki">
        0
      </span>

      <button onclick="changeQty('teriyaki',1)">
        +
      </button>

    </div>

  </div>

</div>


<!-- YANGNyeom -->

<div class="menu-card">

  <img src="https://images.unsplash.com/photo-1525755662778-989d0524087e?auto=format&fit=crop&w=900&q=80">

  <div class="menu-content">

    <h3>Yangnyeom Chicken</h3>

    <div class="price">
      ₱120
    </div>

    <div class="controls">

      <button onclick="changeQty('yangnyeom',-1)">
        −
      </button>

      <span class="qty" id="qty-yangnyeom">
        0
      </span>

      <button onclick="changeQty('yangnyeom',1)">
        +
      </button>

    </div>

  </div>

</div>


<!-- HONEY GARLIC -->

<div class="menu-card">

  <img src="https://images.unsplash.com/photo-1562967916-eb82221dfb92?auto=format&fit=crop&w=900&q=80">

  <div class="menu-content">

    <h3>Honey Garlic Butter</h3>

    <div class="price">
      ₱120
    </div>

    <div class="controls">

      <button onclick="changeQty('honeyGarlic',-1)">
        −
      </button>

      <span class="qty" id="qty-honeyGarlic">
        0
      </span>

      <button onclick="changeQty('honeyGarlic',1)">
        +
      </button>

    </div>

  </div>

</div>


<!-- ORDER BOX -->

<div class="order-box">

  <h2>Your Order</h2>

  <div id="orderSummary">
    <p>No items selected.</p>
  </div>


  <div class="total">
    Total: ₱<span id="total">0</span>
  </div>


  <!-- PAYMENT -->

  <div class="payment-title">
    Payment Method
  </div>


  <div class="payment-options">

    <label class="payment-option">

      <input
        type="radio"
        name="payment"
        value="online"
        onchange="selectPayment('online')"
      >

      <span>💳 Pay via QR</span>

    </label>


    <label class="payment-option">

      <input
        type="radio"
        name="payment"
        value="cash"
        onchange="selectPayment('cash-counter')"
      >

      <span>💵 Pay at Counter</span>

    </label>


    <label class="payment-option">

      <input
        type="radio"
        name="payment"
        value="cash"
        onchange="selectPayment('cash-table')"
      >

      <span>🪑 Pay at Table</span>

    </label>

  </div>


  <!-- QR SECTION -->

  <div id="qrSection">

    <strong>Scan to Pay</strong>

    <div id="qrcode"></div>

    <p style="font-size:14px;">
      Demo QR payment
    </p>

    <button
      class="pay-button"
      onclick="markAsPaid()"
    >
      I've Paid
    </button>

    <p id="paymentMessage"></p>

  </div>


  <!-- SEND -->

  <button
    class="send-button"
    id="sendButton"
    onclick="sendOrder()"
  >
    Send Order
  </button>

</div>


<!-- SUCCESS -->

<div
  class="success"
  id="successBox"


  <h3>
    Order Sent Successfully!
  </h3>

  <p>
    Your order has been received by the restaurant.
  </p>

</div>


<!-- ERROR -->

<div
  class="error"
  id="errorBox"
</div>



</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://isqcuycjrbjtmqhzckvb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_PM2N85UZqFZqc-2XQ04IPg_ulOxQkt4";

const RESTAURANT_ID =
"4a57c402-8fa5-4cd8-a4df-981185f353de";


/* =========================
   TABLE
========================= */

const params =
new URLSearchParams(
  window.location.search
);

const table =
params.get("table") || "?";

document.getElementById(
  "tableNumber"
).textContent = table;


/* =========================
   MENU
========================= */

const menu = {

  teriyaki:{
    name:"Teriyaki Chicken",
    price:120,
    qty:0
  },

  yangnyeom:{
    name:"Yangnyeom Chicken",
    price:120,
    qty:0
  },

  honeyGarlic:{
    name:"Honey Garlic Butter",
    price:120,
    qty:0
  }

};


/* =========================
   PAYMENT
========================= */

let selectedPayment = null;

let paymentStatus = "pending";

let paymentReference = null;


/* =========================
   CHANGE QUANTITY
========================= */

function changeQty(item, amount){

  menu[item].qty += amount;

  if(menu[item].qty < 0){
    menu[item].qty = 0;
  }

  document.getElementById(
    "qty-" + item
  ).textContent =
    menu[item].qty;

  updateOrder();

}


/* =========================
   UPDATE ORDER
========================= */

function updateOrder(){

  const summary =
    document.getElementById(
      "orderSummary"
    );

  let total = 0;

  let html = "";


  Object.values(menu).forEach(item => {

    if(item.qty > 0){

      const subtotal =
        item.qty * item.price;

      total += subtotal;

      html += `

        <div class="order-item">

          <span>
            ${item.name} x${item.qty}
          </span>

          <span>
            ₱${subtotal}
          </span>

        </div>

      `;

    }

  });


  if(html === ""){

    html =
      "<p>No items selected.</p>";

  }


  summary.innerHTML =
    html;


  document.getElementById(
    "total"
  ).textContent =
    total;

}


/* =========================
   SELECT PAYMENT
========================= */

function selectPayment(method){

  selectedPayment =
    method;

  const qrSection =
    document.getElementById(
      "qrSection"
    );

  const paymentMessage =
    document.getElementById(
      "paymentMessage"
    );


  if(method === "online"){

    qrSection.style.display =
      "block";

    paymentStatus =
      "pending";

    paymentReference =
      null;

    paymentMessage.textContent =
      "Payment is still pending.";

    generateQR();

  }else{

    qrSection.style.display =
      "none";

    paymentStatus =
      "pending";

    paymentReference =
      null;

  }

}


/* =========================
   GENERATE DEMO QR
========================= */

function generateQR(){

  const qr =
    document.getElementById(
      "qrcode"
    );

  qr.innerHTML = "";


  const total =
    document.getElementById(
      "total"
    ).textContent;


  const demoPayment =
    "HALINAQR-DEMO-" +
    table +
    "-" +
    total;


  new QRCode(qr,{

    text:demoPayment,

    width:180,

    height:180

  });

}


/* =========================
   MARK AS PAID
========================= */

function markAsPaid(){

  if(
    selectedPayment !==
    "online"
  ){

    return;

  }


  paymentStatus =
    "paid";


  paymentReference =
    "DEMO-" +
    Date.now();


  document.getElementById(
    "paymentMessage"
  ).textContent =
    "✓ Payment marked as PAID";

}


/* =========================
   SEND ORDER
========================= */

async function sendOrder(){

  const errorBox =
    document.getElementById(
      "errorBox"
    );

  const successBox =
    document.getElementById(
      "successBox"
    );

  const sendButton =
    document.getElementById(
      "sendButton"
    );


  errorBox.style.display =
    "none";

  successBox.style.display =
    "none";


  /* BUILD CART */

  let cart = [];

  let total = 0;


  Object.values(menu).forEach(item => {

    if(item.qty > 0){

      cart.push({

        name:item.name,

        quantity:item.qty,

        price:item.price

      });


      total +=
        item.qty *
        item.price;

    }

  });


  /* CHECK ITEMS */

  if(cart.length === 0){

    errorBox.textContent =
      "Please select at least one item.";

    errorBox.style.display =
      "block";

    return;

  }


  /* CHECK PAYMENT */

  if(!selectedPayment){

    errorBox.textContent =
      "Please select a payment method.";

    errorBox.style.display =
      "block";

    return;

  }


  /* QR PAYMENT MUST BE PAID */

  if(
    selectedPayment === "online" &&
    paymentStatus !== "paid"
  ){

    errorBox.textContent =
      "Please complete the QR payment first.";

    errorBox.style.display =
      "block";

    return;

  }


  sendButton.disabled =
    true;

  sendButton.textContent =
    "Sending Order...";


  /*
    DATABASE VALUES:

    QR     = online
    Counter = cash
    Table   = cash
  */

  const dbPaymentMethod =
    selectedPayment === "online"
      ? "online"
      : "cash";


  const orderData = {

    restaurant_id:
      RESTAURANT_ID,

    table_number:
      table,

    items:
      cart,

    total:
      total,

    status:
      "new",

    payment_method:
      dbPaymentMethod,

    payment_status:
      paymentStatus,

    payment_reference:
      paymentReference

  };


  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/orders",

        {

          method:"POST",

          headers:{

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify(
              orderData
            )

        }

      );


    if(!response.ok){

      const errorText =
        await response.text();

      throw new Error(

        "Status " +
        response.status +
        ": " +
        errorText

      );

    }


    /* SUCCESS */

    successBox.style.display =
      "block";


    successBox.scrollIntoView({
      behavior:"smooth"
    });


    sendButton.textContent =
      "Order Sent";


    /* RESET MENU */

    Object.keys(menu).forEach(item => {

      menu[item].qty =
        0;

      document.getElementById(
        "qty-" + item
      ).textContent =
        "0";

    });


    updateOrder();


  }catch(error){

    console.error(error);


    errorBox.textContent =
      "❌ Order could not be sent.\n" +
      error.message;


    errorBox.style.display =
      "block";


    sendButton.disabled =
      false;


    sendButton.textContent =
      "Send Order";

  }

}

</script>

</body>
</html>
