<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HalinaQR Ordering</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f1e8;
      color: #2d2118;
    }

    .hero {
      height: 220px;
      background:
        linear-gradient(rgba(45, 30, 20, 0.35), rgba(45, 30, 20, 0.55)),
        url("https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=1200&q=80");
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }

    .hero h1 {
      font-size: 38px;
      margin: 0;
      font-weight: 800;
    }

    .hero p {
      margin-top: 8px;
      font-size: 16px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px 15px 40px;
    }

    .table-box {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-top: -35px;
      position: relative;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
      text-align: center;
    }

    .table-label {
      font-size: 14px;
      color: #777;
    }

    .table-number {
      font-size: 28px;
      font-weight: bold;
      margin-top: 4px;
    }

    h2 {
      margin-top: 30px;
      margin-bottom: 15px;
    }

    .menu-card {
      background: white;
      border-radius: 18px;
      margin-bottom: 18px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .food-image {
      width: 100%;
      height: 190px;
      object-fit: cover;
    }

    .food-info {
      padding: 15px;
    }

    .food-name {
      font-size: 20px;
      font-weight: bold;
    }

    .price {
      margin-top: 5px;
      font-size: 18px;
      font-weight: bold;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 15px;
      gap: 10px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .qty-btn {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      font-size: 22px;
      background: #e8d5bd;
      cursor: pointer;
    }

    .qty {
      font-size: 18px;
      font-weight: bold;
      min-width: 20px;
      text-align: center;
    }

    .add-btn {
      flex: 1;
      border: none;
      padding: 12px;
      border-radius: 12px;
      background: #6b3e26;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .order-box {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-top: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .total {
      display: flex;
      justify-content: space-between;
      font-size: 22px;
      font-weight: bold;
      margin-top: 18px;
    }

    .send-btn {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: #238636;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .empty {
      color: #888;
      text-align: center;
    }

    @media (max-width: 480px) {
      .hero h1 {
        font-size: 32px;
      }

      .food-image {
        height: 170px;
      }
    }
  </style>
</head>

<body>

  <div class="hero">
    <div>
      <h1>HALINAQR</h1>
      <p>Scan • Order • Enjoy</p>
    </div>
  </div>

  <div class="container">

    <div class="table-box">
      <div class="table-label">You're ordering from</div>
      <div class="table-number">
        TABLE <span id="tableNumber">?</span>
      </div>
    </div>

    <h2>🍗 Our Menu</h2>

    <!-- TERIYAKI -->
    <div class="menu-card">
      <img
        class="food-image"
        src="https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=900&q=80"
        alt="Teriyaki Chicken">

      <div class="food-info">
        <div class="food-name">Teriyaki Chicken</div>
        <div class="price">₱120</div>

        <div class="controls">
          <div class="quantity">
            <button class="qty-btn" onclick="changeQty('teriyaki', -1)">−</button>
            <span class="qty" id="qty-teriyaki">0</span>
            <button class="qty-btn" onclick="changeQty('teriyaki', 1)">+</button>
          </div>

          <button class="add-btn" onclick="addToOrder('Teriyaki Chicken', 120, 'teriyaki')">
            Add to Order
          </button>
        </div>
      </div>
    </div>

    <!-- YANGNYEOM -->
    <div class="menu-card">
      <img
        class="food-image"
        src="https://images.unsplash.com/photo-1525755662778-989d0524087e?auto=format&fit=crop&w=900&q=80"
        alt="Yangnyeom Chicken">

      <div class="food-info">
        <div class="food-name">Yangnyeom Chicken</div>
        <div class="price">₱120</div>

        <div class="controls">
          <div class="quantity">
            <button class="qty-btn" onclick="changeQty('yangnyeom', -1)">−</button>
            <span class="qty" id="qty-yangnyeom">0</span>
            <button class="qty-btn" onclick="changeQty('yangnyeom', 1)">+</button>
          </div>

          <button class="add-btn" onclick="addToOrder('Yangnyeom Chicken', 120, 'yangnyeom')">
            Add to Order
          </button>
        </div>
      </div>
    </div>

    <!-- HONEY GARLIC -->
    <div class="menu-card">
      <img
        class="food-image"
        src="https://images.unsplash.com/photo-1562967916-eb82221dfb92?auto=format&fit=crop&w=900&q=80"
        alt="Honey Garlic Butter Chicken">

      <div class="food-info">
        <div class="food-name">Honey Garlic Butter</div>
        <div class="price">₱120</div>

        <div class="controls">
          <div class="quantity">
            <button class="qty-btn" onclick="changeQty('honeygarlic', -1)">−</button>
            <span class="qty" id="qty-honeygarlic">0</span>
            <button class="qty-btn" onclick="changeQty('honeygarlic', 1)">+</button>
          </div>

          <button class="add-btn" onclick="addToOrder('Honey Garlic Butter', 120, 'honeygarlic')">
            Add to Order
          </button>
        </div>
      </div>
    </div>

    <!-- ORDER SUMMARY -->
    <div class="order-box">

      <h2>🛒 Your Order</h2>

      <div id="orderList">
        <div class="empty">No items added yet.</div>
      </div>

      <div class="total">
        <span>Total</span>
        <span>₱<span id="total">0</span></span>
      </div>

      <button class="send-btn" onclick="sendOrder()">
        SEND ORDER
      </button>

    </div>

  </div>

  <script>

    // SUPABASE
    const SUPABASE_URL =
      "https://isqcuycjrbjtmqhzckvb.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_PM2N85UZqFZqc-2XQ04IPg_ulOxQkt4";

    // TABLE FROM QR URL
    const params = new URLSearchParams(window.location.search);
    const table = params.get("table") || "?";

    document.getElementById("tableNumber").textContent = table;

    // CART
    let cart = [];
    let quantities = {
      teriyaki: 0,
      yangnyeom: 0,
      honeygarlic: 0
    };

    function changeQty(item, amount) {

      quantities[item] += amount;

      if (quantities[item] < 0) {
        quantities[item] = 0;
      }

      document.getElementById("qty-" + item).textContent =
        quantities[item];
    }

    function addToOrder(name, price, id) {

      const quantity = quantities[id];

      if (quantity <= 0) {
        alert("Please select a quantity first.");
        return;
      }

      const existing = cart.find(item => item.name === name);

      if (existing) {
        existing.quantity += quantity;
      } else {
        cart.push({
          name: name,
          price: price,
          quantity: quantity
        });
      }

      quantities[id] = 0;

      document.getElementById("qty-" + id).textContent = "0";

      updateOrder();
    }

    function updateOrder() {

      const orderList = document.getElementById("orderList");

      if (cart.length === 0) {
        orderList.innerHTML =
          '<div class="empty">No items added yet.</div>';

        document.getElementById("total").textContent = "0";
        return;
      }

      let html = "";
      let total = 0;

      cart.forEach(item => {

        const subtotal =
          item.price * item.quantity;

        total += subtotal;

        html += `
          <div class="order-item">
            <span>
              ${item.name} x${item.quantity}
            </span>

            <span>
              ₱${subtotal}
            </span>
          </div>
        `;
      });

      orderList.innerHTML = html;

      document.getElementById("total").textContent = total;
    }

    async function sendOrder() {

      if (cart.length === 0) {
        alert("Please add an item to your order.");
        return;
      }

      if (table === "?") {
        alert("Table number is missing.");
        return;
      }

      let total = 0;

      cart.forEach(item => {
        total += item.price * item.quantity;
      });

      const orderData = {
        table_number: table,
        items: cart,
        total: total,
        status: "new"
      };

      try {

        const response = await fetch(
          SUPABASE_URL + "/rest/v1/orders",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY,
              "Prefer": "return=minimal"
            },

            body: JSON.stringify(orderData)
          }
        );

        if (!response.ok) {

          const errorText = await response.text();

          throw new Error(errorText);
        }

        alert("✅ Order sent successfully!");

        cart = [];
        updateOrder();

      } catch (error) {

        console.error(error);

        alert(
          "❌ Order failed.\n\n" +
          "Please try again."
        );
      }
    }

  </script>

</body>
</html>
