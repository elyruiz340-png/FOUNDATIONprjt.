const HALINA_RESTAURANT_ID='5e562ca7-38aa-4894-8265-ddca2f4e61b6';
let MENU_ROWS=[], CATEGORY_ROWS=[], MENU_STOCK_ROWS=[], menuLoadError='';
const menuEsc=v=>esc(String(v??''));
async function loadMenuData(){
  const [cr,mr,sr]=await Promise.all([
    sb.from('menu_categories').select('id,restaurant_id,name,description,image_url,sort_order,is_active,created_at').eq('restaurant_id',HALINA_RESTAURANT_ID).order('sort_order').order('name'),
    sb.from('menu_items').select('id,restaurant_id,category_id,name,description,price,image_url,is_available,sort_order,stock_product_id,created_at').eq('restaurant_id',HALINA_RESTAURANT_ID).order('sort_order').order('name'),
    sb.from('PRODUCT_STOCK').select('id,product_id,product_name,stock_group,is_available,is_archived').not('product_id','is',null).order('product_name')
  ]);
  if(cr.error) throw cr.error;
  if(mr.error) throw mr.error;
  CATEGORY_ROWS=cr.data||[]; MENU_ROWS=mr.data||[];
  MENU_STOCK_ROWS=(sr.error?[]:(sr.data||[])).filter(x=>x.product_id && x.is_archived!==true);
  menuLoadError=sr.error?('Menu loaded, but stock links could not be loaded: '+sr.error.message):'';
}
function menuImageUploadField(id,label,current){
  return `<div class="fl"><label for="${id}">${label} (JPG, PNG, WebP; max 5 MB)</label><input id="${id}" type="file" accept="image/jpeg,image/png,image/webp"></div>${current?`<p class="note">Current image: <a href="${menuEsc(current)}" target="_blank" rel="noopener">View image</a></p>`:''}`;
}
async function uploadMenuImage(file,kind){
  if(!file)return null;
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024) throw new Error('Photo must be JPG, PNG, or WebP and no larger than 5 MB.');
  const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';
  const path=HALINA_RESTAURANT_ID+'/'+kind+'/'+crypto.randomUUID()+'.'+ext;
  const up=await sb.storage.from('halina-menu-images').upload(path,file,{contentType:file.type,upsert:false});
  if(up.error)throw up.error;
  return sb.storage.from('halina-menu-images').getPublicUrl(path).data.publicUrl;
}
function menuPage(){
  const q=(S.f.q||'').trim().toLowerCase(),cat=S.f.mcat||'';

  const catName=id=>CATEGORY_ROWS.find(c=>c.id===id)?.name||'No category';
  return `<div class="tb"><input data-c="q" value="${menuEsc(S.f.q||'')}" placeholder="Search menu items…" aria-label="Search menu items"><select data-c="mcat" aria-label="Filter by category"><option value="">All categories</option>${CATEGORY_ROWS.map(c=>`<option value="${c.id}"${cat===c.id?' selected':''}>${menuEsc(c.name)}${c.is_active?'':' (inactive)'}</option>`).join('')}</select><button class="btn pri" data-a="menuadd">+ Add menu item</button><button class="btn" data-a="catmanage">Manage categories</button><button class="btn" data-a="menurefresh">Refresh</button></div>
  <p class="mu">${CATEGORY_ROWS.length} categories · ${MENU_ROWS.length} menu items · HALINA BISTRO CAFE · Supabase</p>

  <div class="g g2">${rows.map(m=>`<div class="card"><div class="row" style="align-items:flex-start;gap:12px">${m.image_url?`<img src="${menuEsc(m.image_url)}" alt="" style="width:76px;height:76px;object-fit:cover;border-radius:10px">`:`<div style="width:76px;height:76px;border-radius:10px;background:var(--sf);display:grid;place-items:center;color:var(--mu)">No photo</div>`}<div style="flex:1;min-width:0"><div class="row"><b>${menuEsc(m.name)}</b>${bdg(m.is_available?'Available':'Unavailable')}</div><div class="mu">${menuEsc(catName(m.category_id))}</div><div class="big">${M(Number(m.price)||0)}</div></div></div>${m.description?`<p class="mu">${menuEsc(m.description)}</p>`:''}<div class="tb"><button class="btn" data-a="menuedit" data-i="${m.id}">Edit item</button><button class="btn" data-a="menutoggle" data-i="${m.id}">${m.is_available?'Make unavailable':'Make available'}</button></div></div>`).join('')||`<div class="card">${empty(q||cat?'No menu items match this filter.':'No HALINA menu items yet. Add a category first, then create your first menu item.')}</div>`}</div>`;
}

  L.innerHTML=`<div class="bk" data-a="close"></div><form id="menuItemForm" class="md" role="dialog" aria-modal="true" aria-label="${old?'Edit':'Add'} menu item"><h3>${old?'Edit menu item':'Add menu item'}</h3><p class="note">Changes save to HALINA's Supabase records only. Stock quantities are not edited here.</p>

  <div class="fl"><label for="miStock">Link existing inventory item (optional)</label><select id="miStock"><option value="">No stock link</option>${stock.map(x=>`<option value="${menuEsc(x.product_id)}"${old?.stock_product_id===x.product_id?' selected':''}>${menuEsc(x.product_name)} · ${menuEsc(x.product_id)}${x.is_available===false?' (unavailable)':''}</option>`).join('')}</select><p class="note">Only existing stock records appear here. Linking does not change stock quantity. Automatic deduction for new menu IDs still requires the ordering workflow to use this mapping.</p></div>
  ${menuImageUploadField('miPhoto','Menu item photo',old?.image_url)}
  <div class="fl"><label><input id="miAvailable" type="checkbox"${old?.is_available!==false?' checked':''}> Available for ordering</label></div>
  <div class="tb"><button class="btn pri" type="submit" id="miSave">${old?'Save item':'Create item'}</button><button class="btn" type="button" data-a="close">Cancel</button></div><p id="miErr" class="er" role="alert"></p></form>`;
  const catSel=$('#miCat'),newWrap=$('#miNewCatWrap');
  catSel.onchange=()=>{newWrap.hidden=catSel.value!=='__new__';if(!newWrap.hidden)$('#miNewCat').focus();};
  $('#menuItemForm').onsubmit=async e=>{
    e.preventDefault();const btn=$('#miSave'),err=$('#miErr');err.textContent='';
    const name=$('#miName').value.trim(),description=$('#miDesc').value.trim(),price=Number($('#miPrice').value),file=$('#miPhoto').files[0];
    if(!name||!Number.isFinite(price)||price<0){err.textContent='Enter a valid name and non-negative price.';return;}
    btn.disabled=true;btn.textContent='Saving…';
    try{
      let categoryId=catSel.value;
      if(categoryId==='__new__'){
        const cn=$('#miNewCat').value.trim();
        if(!cn)throw new Error('Enter the new category name.');
        const dup=CATEGORY_ROWS.find(c=>c.name.trim().toLowerCase()===cn.toLowerCase());

        let catImage=null;const cf=$('#miNewCatPhoto').files[0];if(cf)catImage=await uploadMenuImage(cf,'categories');

      let imageUrl=old?.image_url||null;if(file)imageUrl=await uploadMenuImage(file,'items');
      const payload={restaurant_id:HALINA_RESTAURANT_ID,category_id:categoryId,name,description:description||null,price,image_url:imageUrl,is_available:$('#miAvailable').checked,stock_product_id:$('#miStock').value||null};

  };

  const cats=[...new Set(AUDIT_ROWS.map(a=>a.action_category).filter(Boolean))].sort();
  const opt=(value,label,selected)=>`<option value="${esc(value)}"${selected===value?' selected':''}>${esc(label)}</option>`;
  return `<div class="tb">
    <input data-c="auditQ" value="${esc(S.f.auditQ||'')}" placeholder="Search actor, action, record…" aria-label="Search audit logs">

    `<button class="btn" data-a="auditdetail" data-id="${esc(a.id)}">Details</button>`
  ]})))}</div>`}
  <p class="note" style="margin-top:10px">Read-only audit history. Database triggers currently record changes to orders, payments, menu items/categories, staff links, and inventory. Failed login attempts and actions not wired to these tables are not included yet.</p>`;
}
function auditDetail(id){
  const a=AUDIT_ROWS.find(x=>String(x.id)===String(id));
  if(!a){toast('Audit record not found. Refresh and try again.',1);return;}
  drawer('Audit log details',`<div class="row"><span class="mu">Time</span><b>${esc(a.created_at?new Date(a.created_at).toLocaleString('en-PH'):'—')}</b></div>
  <div class="row"><span class="mu">Actor</span><b>${esc(a.actor_name||'System')}</b></div>
  <div class="row"><span class="mu">Role</span><b>${esc(a.actor_role||'system')}</b></div>
  <div class="row"><span class="mu">Category</span><b>${esc(a.action_category||'—')}</b></div>
  <div class="row"><span class="mu">Action</span><b>${esc(a.action||'—')}</b></div>
  <div class="row"><span class="mu">Record</span><b>${esc(a.record_type||'—')} ${esc(a.record_id||'')}</b></div>

  <h3 style="margin-top:14px">Before / after details</h3>
  <pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:var(--s);padding:12px;border-radius:10px;font:12px/1.5 ui-monospace,monospace">${esc(JSON.stringify(a.details||{},null,2))}</pre>
  <p class="note">PINs, passwords, OTPs, and secret credentials are not intentionally included.</p>`);

async function loadStaffData(){
  const {data,error}=await sb
    .from('restaurant_users')
    .select('id,user_id,restaurant_id,role,cashier_username,full_name,display_name,position,permissions,created_at,is_active,deactivated_at')
    .eq('restaurant_id',HALINA_RESTAURANT_ID)
    .order('created_at',{ascending:true});
  if(error)throw error;
  STAFF_ROWS=data||[];
  const {data:sessions,error:sessionError}=await sb.from('staff_sessions')
    .select('id,restaurant_id,restaurant_user_id,user_id,login_at,logout_at,last_seen_at,end_reason')
    .eq('restaurant_id',HALINA_RESTAURANT_ID)
    .order('login_at',{ascending:false}).limit(1000);
  if(sessionError){STAFF_SESSIONS=[];staffHistoryError=sessionError.message||'Could not load session history';}
  else {STAFF_SESSIONS=sessions||[];staffHistoryError='';}
  staffLoadError='';
}
function staffDuration(start,end){
  if(!start)return '—';
  const ms=Math.max(0,new Date(end||Date.now())-new Date(start));
  const mins=Math.floor(ms/60000), days=Math.floor(mins/1440), hours=Math.floor((mins%1440)/60), rem=mins%60;
  return days?`${days}d ${hours}h ${rem}m`:hours?`${hours}h ${rem}m`:`${rem}m`;
}
function staffLatestSession(u){
  return STAFF_SESSIONS.find(s=>s.restaurant_user_id===u.id && !s.logout_at && Date.now()-new Date(s.last_seen_at).getTime()<120000);
}
function staffPage(){
  const permissionNames={orders:'Orders',tables:'Tables',stocks:'Stocks',dispatcher:'Dispatcher',settings:'Settings'};
  const rows=STAFF_ROWS.map(u=>{
    const isCurrentUser=!!CURRENT_AUTH_USER_ID&&u.user_id===CURRENT_AUTH_USER_ID;
    const accountLabel=u.display_name||u.full_name||u.cashier_username||(
      isCurrentUser&&S.user ? S.user :
      String(u.role||'').toLowerCase()==='owner' ? 'Owner account' : 'Username not set'
    );
    const permissions=u.permissions||{};
    const permissionLabel=Object.keys(permissionNames).filter(key=>permissions[key]===true).map(key=>permissionNames[key]).join(', ')||'None assigned';
    const active=u.is_active!==false;
    const online=active&&!!staffLatestSession(u);
    const status=active?(online?'<span class="bd">● Online</span>':'<span class="bd">● Offline</span>'):'<span class="bd er">Deactivated</span>';
    const actions=String(u.role||'').toLowerCase()==='staff'
      ? `<button class="btn" type="button" data-a="staffresetpin" data-id="${esc(u.id)}" style="white-space:nowrap">Reset PIN</button> ${active?`<button class="btn" type="button" data-a="staffdeactivate" data-id="${esc(u.id)}" style="white-space:nowrap">Deactivate</button>`:'<span class="mu">Inactive</span>'}`
      : '<span class="mu">—</span>';
    return {c:[esc(accountLabel),esc(u.position||'—'),esc(u.cashier_username||'—'),esc(u.role||'Unassigned'),status,esc(permissionLabel),u.created_at?esc(new Date(u.created_at).toLocaleDateString('en-PH')):'—',actions]};
  });
  return `<div class="tb"><span class="mu">${STAFF_ROWS.length} linked account(s) · HALINA BISTRO CAFE</span><button class="btn pri" data-a="addstaff">+ Add Staff</button><button class="btn" data-a="staffhistory">Login History</button><button class="btn" data-a="staffrefresh">Refresh</button></div>
  ${staffLoadError?`<div class="card"><span class="bd er">● Could not load staff</span><p>${esc(staffLoadError)}</p></div>`:
    STAFF_ROWS.length?`<div class="card">${tbl(['Staff Name','Position','Username','Role','Status','Permissions','Date Added','Actions'],rows)}</div>`:
    `<div class="card"><h3>No staff records returned</h3><p class="mu">No staff records were returned for this restaurant.</p></div>`}
  ${staffHistoryError?`<div class="card" style="margin-top:12px"><p class="mu">Login history unavailable: ${esc(staffHistoryError)}</p></div>`:''}
  <div class="card" style="margin-top:14px"><h3>Account & Session Security</h3><p>• Five incorrect PIN attempts trigger the existing lockout.</p><p>• Deactivated staff accounts are retained with their session history.</p><p>• Online means an active session heartbeat was received within the last 2 minutes.</p></div>`;
}
PG.staff=staffPage;
A.addstaff=()=>staffAddForm();
A.staffrefresh=async()=>{
  try{await loadStaffData();render();toast('Staff list refreshed');}
  catch(e){staffLoadError=e.message||String(e);render();}
};
A.staffhistory=()=>{
  const names=new Map(STAFF_ROWS.map(u=>[u.id,u.display_name||u.full_name||u.cashier_username||u.role||'Staff']));
  L.innerHTML=`<div class="bk" data-a="close"></div><div class="md" role="dialog" aria-modal="true" style="max-width:980px;width:min(980px,96vw)"><h3>Staff Login History</h3><p class="note">Saved login/logout times and calculated session duration.</p><div class="fl"><label for="staffHistoryUser">Staff account</label><select id="staffHistoryUser"><option value="">All staff</option>${STAFF_ROWS.map(u=>`<option value="${esc(u.id)}">${esc(names.get(u.id))}</option>`).join('')}</select></div><div class="fl"><label for="staffHistoryDate">Date (login date)</label><input id="staffHistoryDate" type="date"></div><div id="staffHistoryRows" style="max-height:55vh;overflow:auto;margin-top:12px"></div><div class="tb"><button class="btn" type="button" data-a="close">Close</button></div></div>`;
  const renderHistory=()=>{
    const userId=L.querySelector('#staffHistoryUser').value,date=L.querySelector('#staffHistoryDate').value;
    const records=STAFF_SESSIONS.filter(s=>(!userId||s.restaurant_user_id===userId)&&(!date||String(s.login_at||'').slice(0,10)===date));
    const html=records.length?`<div class="card">${tbl(['Staff','Login','Logout','Duration','End Reason'],records.map(s=>({c:[esc(names.get(s.restaurant_user_id)||'Staff'),esc(s.login_at?new Date(s.login_at).toLocaleString('en-PH'):'—'),esc(s.logout_at?new Date(s.logout_at).toLocaleString('en-PH'):'Still active / timed out'),esc(staffDuration(s.login_at,s.logout_at||s.last_seen_at)),esc(s.end_reason|| (s.logout_at?'logout':'active/unknown'))]})))}</div>`:'<p class="mu">No sessions match these filters.</p>';
    L.querySelector('#staffHistoryRows').innerHTML=html;
  };
  L.querySelector('#staffHistoryUser').addEventListener('change',renderHistory);
  L.querySelector('#staffHistoryDate').addEventListener('change',renderHistory);
  renderHistory();
};
A.staffdeactivate=async(button)=>{
  const id=button.dataset.id,staff=STAFF_ROWS.find(u=>u.id===id);
  if(!staff||String(staff.role||'').toLowerCase()!=='staff'||staff.is_active===false){toast('Staff account could not be verified');return;}
  const name=staff.display_name||staff.full_name||staff.cashier_username||'this staff account';
  if(!confirm(`Deactivate ${name}? They will no longer be able to log in. Their session history will be retained.`))return;
  button.disabled=true;
  try{
    const {data,error}=await sb.functions.invoke('staff-session-action',{body:{action:'deactivate',restaurant_user_id:id}});
    if(error)throw new Error(error.message||'Deactivation request failed');
    if(!data?.success)throw new Error(data?.error||'Deactivation was not confirmed');
    await loadStaffData();render();toast('Staff account deactivated; history retained');
  }catch(e){button.disabled=false;toast(e.message||'Unable to deactivate staff account');}
};

A.staffresetpin=(button)=>{
  const staffId=button.dataset.id;
  const staff=STAFF_ROWS.find(row=>row.id===staffId);
  if(!staff||String(staff.role||'').toLowerCase()!=='staff'){
    toast('That staff account could not be verified');return;
  }
  const staffName=staff.display_name||staff.full_name||staff.cashier_username||'this staff account';
  let challengeId='',otpVerified=false;
  L.innerHTML=`<div class="bk" data-a="close"></div><div class="md" role="dialog" aria-modal="true" aria-labelledby="resetPinTitle">
    <h3 id="resetPinTitle">Reset Staff PIN</h3>
    <p class="note">Reset PIN for <strong>${esc(staffName)}</strong> (${esc(staff.cashier_username||'username not set')}). Verify the one-time code before choosing a new PIN.</p>
    <div class="card" style="padding:12px;margin:10px 0">
      <strong>Step 1 — Email verification</strong>
      <p class="note" style="margin:5px 0 10px">Testing mode: the code is sent to the email configured in RESEND_TEST_EMAIL. This may differ from the Owner/Admin login email.</p>
      <button id="staffSendOtpBtn" class="btn pri" type="button">Send OTP</button>
      <div id="staffOtpArea" hidden style="margin-top:12px">
        <div class="fl"><label for="staffOtpCode">Six-digit verification code</label><input id="staffOtpCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="Enter OTP"></div>
        <button id="staffVerifyOtpBtn" class="btn" type="button">Verify OTP</button>
      </div>
    </div>
    <form id="staffResetPinForm" autocomplete="off">
      <strong>Step 2 — Set a new PIN</strong>
      <div class="fl" style="margin-top:10px"><label for="staffNewPin">New six-digit PIN *</label><input id="staffNewPin" type="password" inputmode="numeric" required minlength="6" maxlength="6" pattern="[0-9]{6}" autocomplete="new-password" placeholder="Enter new six-digit PIN" disabled></div>
      <div class="fl"><label for="staffNewPinConfirm">Confirm new PIN *</label><input id="staffNewPinConfirm" type="password" inputmode="numeric" required minlength="6" maxlength="6" pattern="[0-9]{6}" autocomplete="new-password" placeholder="Re-enter new PIN" disabled></div>
      <p id="staffResetPinMsg" class="note" role="status" aria-live="polite">Send and verify the OTP first. PIN reset remains locked until verification succeeds.</p>
      <div class="tb"><button id="staffResetPinBtn" class="btn pri" type="submit" disabled>Save New PIN</button><button class="btn" type="button" data-a="close">Cancel</button></div>
    </form>
  </div>`;
  const sendBtn=L.querySelector('#staffSendOtpBtn');
  const otpArea=L.querySelector('#staffOtpArea');
  const verifyBtn=L.querySelector('#staffVerifyOtpBtn');
  const form=L.querySelector('#staffResetPinForm');
  const submitBtn=L.querySelector('#staffResetPinBtn');
  const message=L.querySelector('#staffResetPinMsg');
  const otpInput=L.querySelector('#staffOtpCode');
  const pinInput=L.querySelector('#staffNewPin');
  const confirmInput=L.querySelector('#staffNewPinConfirm');
  sendBtn.onclick=async()=>{
    sendBtn.disabled=true;message.textContent='Requesting verification code…';
    try{
      const {data,error}=await sb.functions.invoke('staff-pin-reset-otp',{body:{action:'request',restaurant_user_id:staffId}});
      if(error)throw error;
      if(!data?.success||!data?.challenge_id)throw new Error(data?.error||'Could not request OTP.');
      challengeId=data.challenge_id;otpVerified=false;otpArea.hidden=false;
      pinInput.disabled=true;confirmInput.disabled=true;submitBtn.disabled=true;
      message.textContent='OTP sent to the configured Resend test inbox. It expires in 10 minutes.';
      otpInput.focus();sendBtn.textContent='Request another code';
    }catch(error){message.textContent=error?.message||'Unable to send OTP.';}
    finally{sendBtn.disabled=false;}
  };
  verifyBtn.onclick=async()=>{
    const code=otpInput.value.trim();
    if(!challengeId){message.textContent='Request an OTP first.';return;}
    if(!/^\d{6}$/.test(code)){message.textContent='Enter the six-digit code.';otpInput.focus();return;}
    verifyBtn.disabled=true;message.textContent='Verifying code…';
    try{
      const {data,error}=await sb.functions.invoke('staff-pin-reset-otp',{body:{action:'verify',challenge_id:challengeId,otp:code}});
      if(error)throw error;
      if(!data?.success)throw new Error(data?.error||'OTP verification failed.');
      otpVerified=true;otpInput.disabled=true;verifyBtn.disabled=true;sendBtn.disabled=true;
      pinInput.disabled=false;confirmInput.disabled=false;submitBtn.disabled=false;
      message.textContent='OTP verified. You may now set the new PIN.';pinInput.focus();
    }catch(error){message.textContent=error?.message||'Unable to verify OTP.';verifyBtn.disabled=false;}
  };
  form.onsubmit=async event=>{
    event.preventDefault();
    if(!form.reportValidity())return;
    if(!otpVerified||!challengeId){message.textContent='Verify the OTP before resetting the PIN.';return;}
    const pin=pinInput.value,confirmPin=confirmInput.value;
    if(!/^[0-9]{6}$/.test(pin)){message.textContent='PIN must contain exactly six digits.';return;}
    if(pin!==confirmPin){message.textContent='The PIN entries do not match.';return;}
    if(!CURRENT_AUTH_USER_ID){message.textContent='Your session could not be verified. Sign in again and retry.';return;}
    submitBtn.disabled=true;message.textContent='Updating PIN securely…';
    try{
      const {error}=await sb.rpc('reset_cashier_pin_with_otp',{p_challenge_id:challengeId,p_new_pin:pin});
      if(error)throw error;
      pinInput.value='';confirmInput.value='';closeL();toast('Staff PIN reset successfully after OTP verification');
    }catch(error){message.textContent=error?.message||'Unable to reset this staff PIN. No success was confirmed.';submitBtn.disabled=false;}
  };
};

function staffAddForm(){
  L.innerHTML=`<div class="bk" data-a="close"></div><div class="md" role="dialog" aria-modal="true" aria-labelledby="staffFormTitle">
    <h3 id="staffFormTitle">Add Staff Member</h3><p class="note">Create a staff account with a username and initial six-digit PIN. No personal email is required.</p>
    <form id="staffAddForm" autocomplete="off">
      <div class="fl"><label for="staffFullName">Full Name *</label><input id="staffFullName" required maxlength="100" placeholder="Enter full name"></div>
      <div class="fl"><label for="staffDisplayName">Display Name</label><input id="staffDisplayName" maxlength="60" placeholder="Optional display name"></div>
      <div class="fl"><label for="staffPosition">Position *</label><select id="staffPosition" required><option value="Cashier">Cashier</option><option value="Manager">Manager</option><option value="Kitchen Staff">Kitchen Staff</option><option value="Dispatcher">Dispatcher</option></select></div>
      <div class="fl"><label for="staffUsername">Username *</label><input id="staffUsername" required minlength="3" maxlength="40" autocomplete="off" autocapitalize="none" spellcheck="false" pattern="[A-Za-z0-9._-]+" placeholder="Create a unique username"></div>
      <div class="fl"><label for="staffRole">Account Role</label><input id="staffRole" value="Staff" disabled></div>
      <div class="fl"><label for="staffPin">Initial Cashier PIN *</label><input id="staffPin" type="password" inputmode="numeric" required minlength="6" maxlength="6" pattern="[0-9]{6}" autocomplete="new-password" placeholder="Enter six-digit PIN"></div>
      <div class="fl"><label for="staffPinConfirm">Confirm Cashier PIN *</label><input id="staffPinConfirm" type="password" inputmode="numeric" required minlength="6" maxlength="6" pattern="[0-9]{6}" autocomplete="new-password" placeholder="Re-enter six-digit PIN"></div>
      <div class="fl"><label>Permissions</label>
        <label class="row" for="staffPermOrders"><span>Orders</span><input id="staffPermOrders" type="checkbox" checked></label>
        <label class="row" for="staffPermTables"><span>Tables</span><input id="staffPermTables" type="checkbox" checked></label>
        <label class="row" for="staffPermStocks"><span>Stocks</span><input id="staffPermStocks" type="checkbox" checked></label>
        <label class="row" for="staffPermDispatcher"><span>Dispatcher</span><input id="staffPermDispatcher" type="checkbox"></label>
        <label class="row" for="staffPermSettings"><span>Settings</span><input id="staffPermSettings" type="checkbox"></label>
      </div>
      <p class="mu">PIN values are sent only to the secure account-creation endpoint and must not be logged or stored as plain text.</p>
      <p id="staffFormMsg" class="note" role="status" aria-live="polite"></p>
      <div class="tb"><button id="staffCreateBtn" class="btn pri" type="submit">Create Staff Account</button><button class="btn" type="button" data-a="close">Cancel</button></div>
    </form>
  </div>`;
  const form=L.querySelector('#staffAddForm'),submitBtn=L.querySelector('#staffCreateBtn'),message=L.querySelector('#staffFormMsg');
  L.querySelector('#staffFullName').focus();
  form.onsubmit=async event=>{
    event.preventDefault();
    if(!form.reportValidity())return;
    const fullName=L.querySelector('#staffFullName').value.trim();
    const displayName=L.querySelector('#staffDisplayName').value.trim();
    const position=L.querySelector('#staffPosition').value;
    const username=L.querySelector('#staffUsername').value.trim();
    const pin=L.querySelector('#staffPin').value;
    const confirmPin=L.querySelector('#staffPinConfirm').value;
    if(pin!==confirmPin){message.textContent='The PIN entries do not match.';return;}
    const permissions={orders:L.querySelector('#staffPermOrders').checked,tables:L.querySelector('#staffPermTables').checked,stocks:L.querySelector('#staffPermStocks').checked,dispatcher:L.querySelector('#staffPermDispatcher').checked,settings:L.querySelector('#staffPermSettings').checked};
    submitBtn.disabled=true;message.textContent='Creating staff account securely…';
    try{
      const {data,error}=await sb.functions.invoke('create-staff',{body:{restaurant_id:HALINA_RESTAURANT_ID,full_name:fullName,display_name:displayName,position,username,permissions,pin}});
      if(error){let errorMessage=error.message||'Unable to create staff account.';if(error.context&&typeof error.context.json==='function'){try{const detail=await error.context.json();if(detail&&detail.error)errorMessage=detail.error;}catch(_){}}throw new Error(errorMessage);}
      if(!data||data.success!==true)throw new Error(data?.error||'Staff account creation was not confirmed.');
      L.querySelector('#staffPin').value='';L.querySelector('#staffPinConfirm').value='';
      message.textContent='Staff account created. Refreshing staff list…';
      try{await loadStaffData();closeL();render();toast('Staff account created');}
      catch(refreshError){staffLoadError=refreshError.message||String(refreshError);closeL();render();toast('Staff created, but the list could not refresh');}
    }catch(error){L.querySelector('#staffPin').value='';L.querySelector('#staffPinConfirm').value='';message.textContent=error.message||'Unable to create staff account. Please try again.';submitBtn.disabled=false;}
  };
}

load=async function(manual){
  await originalLoad(manual);
  if(!G.hidden)return;
  try{await loadMenuData();if(S.page==='menu')render();}
  catch(e){menuLoadError=e.message||String(e);if(S.page==='menu')render();}
  try{await loadStaffData();if(S.page==='staff')render();}
  catch(e){staffLoadError=e.message||String(e);if(S.page==='staff')render();}
  try{await loadAuditLogs();if(S.page==='audit')render();}
  catch(e){auditLoadError=e.message||String(e);if(S.page==='audit')render();}
};
