/* 8. LIVE DATA — all illustrative, nothing is real */

function inPeriod(date,per){const d=new Date(date),now=new Date();if(Number.isNaN(d.getTime()))return false;const start=new Date(now);if(per==='today'){start.setHours(0,0,0,0);return d>=start&&d<=now}if(per==='yest'){start.setDate(start.getDate()-1);start.setHours(0,0,0,0);const end=new Date(start);end.setHours(23,59,59,999);return d>=start&&d<=end}if(per==='7d')start.setDate(start.getDate()-7);else if(per==='30d')start.setDate(start.getDate()-30);else if(per==='tm')start.setDate(1);else if(per==='lm'){start.setMonth(start.getMonth()-1,1);const end=new Date(now.getFullYear(),now.getMonth(),0,23,59,59,999);return d>=start&&d<=end}else if(per==='ty')start.setMonth(0,1);else if(per==='cu'){const a=new Date(S.cu0+'T00:00:00'),b=new Date(S.cu1+'T23:59:59');return d>=a&&d<=b}return d>=start&&d<=now}

for(const action of ['addmenu','editmenu','addcat','adj','addexp','addstaff','editstaff','addbr','brd','hl','test'])A[action]=()=>toast('This action is not connected to an authorized database write yet. No changes were made.',1);
A.addstock=async()=>{
 const name=$('#stockName')?.value.trim(),category=$('#stockCategory')?.value.trim();
 const total=Number($('#stockTotal')?.value),remaining=Number($('#stockRemaining')?.value),file=$('#stockPhoto')?.files?.[0];
 if(!name||!category){toast('Enter an item name and category.',1);return}
 if(!Number.isInteger(total)||total<0||!Number.isInteger(remaining)||remaining<0){toast('Stock quantities must be whole numbers of 0 or more.',1);return}
 if(file&&(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)){toast('Choose a JPG, PNG, or WebP image up to 5 MB.',1);return}
 const slug=name.toLowerCase().normalize('NFKD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
 if(!slug){toast('Could not generate a product ID from that name.',1);return}
 const button=document.querySelector('[data-a="addstock"]');if(button){button.disabled=true;button.textContent='Saving…'}
 try{
  const productId=slug;
  if(INV.some(x=>x.product_id===productId))throw new Error('This product ID already exists. Choose a different item name.');
  let imageUrl=null;
  if(file){
   const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg';
   const path=`${LIVE_RESTAURANT.id}/${productId}-${Date.now()}.${ext}`;
   const {error:uploadError}=await supabase.storage.from('halina-stock-images').upload(path,file,{contentType:file.type,upsert:false});
   if(uploadError)throw uploadError;
   imageUrl=supabase.storage.from('halina-stock-images').getPublicUrl(path).data.publicUrl;
  }
  const {error}=await supabase.from('PRODUCT_STOCK').insert({product_id:productId,product_name:name,stock_group:productId,stock_total:total,stock_remaining:remaining,category:category.toLowerCase().replace(/\\s+/g,'-'),image_url:imageUrl});
  if(error)throw error;
  await loadLiveData(LIVE_RESTAURANT.id);render();toast('Stock item added successfully.');
 }catch(err){console.error(err);toast(err.message||'Could not save stock item.',1)}
 finally{if(button){button.disabled=false;button.textContent='Add stock item'}}
};

function normalizeStatus(row){const raw=String(row.status||row.order_status||'pending').toLowerCase();return ({new:'New',pending:'New',accepted:'Accepted',confirmed:'Accepted',preparing:'Preparing',ready:'Ready',served:'Served',completed:'Completed',cancelled:'Cancelled',refunded:'Refunded'})[raw]||raw.replace(/_/g,' ').replace(/^./,c=>c.toUpperCase())}

async function loadLiveData(restaurantId){
 const [ordersRes,menuRes,catsRes,staffRes,stockRes]=await Promise.all([
  supabase.from('orders').select('id,restaurant_id,order_number,table_number,order_type,payment_method,payment_status,order_status,subtotal,tax,tip,total,created_at,items,status').eq('restaurant_id',restaurantId).order('created_at',{ascending:false}).limit(500),
  supabase.from('menu_items').select('id,restaurant_id,category_id,name,price,is_available,sort_order').eq('restaurant_id',restaurantId).eq('is_available',true).order('sort_order'),
  supabase.from('menu_categories').select('id,name,sort_order').eq('restaurant_id',restaurantId).eq('is_active',true).order('sort_order'),
  supabase.from('restaurant_users').select('user_id,restaurant_id,role,cashier_username').eq('restaurant_id',restaurantId),
  supabase.from('PRODUCT_STOCK').select('id,product_id,product_name,stock_group,stock_total,stock_remaining,category,image_url').order('id')
 ]);
 if(ordersRes.error)throw new Error('Orders could not be read: '+ordersRes.error.message);
 if(menuRes.error)throw new Error('Menu could not be read: '+menuRes.error.message);
 if(stockRes.error)throw new Error('Inventory could not be read: '+stockRes.error.message);
 const categories=new Map((catsRes.data||[]).map(c=>[c.id,c.name]));
 replaceArray(ORD,(ordersRes.data||[]).map(o=>({id:'ORD-'+o.order_number,dbId:o.id,rawDate:o.created_at,t:dateLabel(o.created_at),b:1,ty:({dine_in:'Dine In',takeout:'Takeout',delivery:'Delivery'})[o.order_type]||o.order_type||'—',s:normalizeStatus(o),pm:({cash:'Cash',card:'Card',online:'Online'})[o.payment_method]||o.payment_method||'—',paymentStatus:o.payment_status||'pending',tot:Number(o.total||0),d:0,it:(Array.isArray(o.items)?o.items:[]).map(i=>({n:i.name||i.item_name||'Item',q:Number(i.quantity||i.qty||1),p:Number(i.price||i.unit_price||0)})),raw:o})));
 replaceArray(MENU,(menuRes.data||[]).map(m=>({id:m.id,n:m.name,c:categories.get(m.category_id)||'Uncategorized',p:Number(m.price||0),a:!!m.is_available})));
 replaceArray(STAFF,(staffRes.data||[]).map(u=>({n:u.cashier_username||('User '+String(u.user_id||'').slice(0,8)),r:u.role||'staff',b:1,s:'Linked',sh:'—',l:'—'})));
 replaceArray(INV,(stockRes.data||[]).map(x=>({id:x.id,product_id:x.product_id,name:x.product_name,stock_group:x.stock_group,total:Number(x.stock_total||0),remaining:Number(x.stock_remaining||0),category:x.category||'others',image_url:x.image_url||''})));
 replaceArray(EXP,[]);replaceArray(AUD,[]);
 replaceArray(NT,ORD.filter(o=>['New','Accepted','Preparing'].includes(o.s)).slice(0,5).map(o=>({ty:'Order update',m:`${o.id} · ${o.s} · ${M(o.tot)}`,r:0})));
 BASE.splice(0,BASE.length,0);AO.splice(0,AO.length,1);EXB.splice(0,EXB.length,0);
}

 const links=(linkRes.data||[]).filter(x=>x.restaurant_id&&['owner','admin'].includes(String(x.role||'').toLowerCase()));
 if(!links.length)throw new Error('This Supabase account has no Owner/Admin restaurant link. Ask the project owner to assign access in restaurant_users.');
 const restIds=[...new Set(links.map(x=>x.restaurant_id))];

 LIVE_CURRENCY=LIVE_RESTAURANT.currency||'PHP';

}
