<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatcher</title>
<style>
:root{--restaurant-font-family:Inter,Arial,sans-serif;--restaurant-font-scale:1;--restaurant-logo-scale:1.15}
:root{--bg:#f4f6f2;--panel:#fff;--ink:#1f2b23;--muted:#788279;--line:#e4e9e2;--green:#238447;--green-soft:#e9f4eb;--amber:#fff3dc;--amber-ink:#946516;--blue:#edf2ff;--blue-ink:#41639c;--shadow:0 5px 18px rgba(31,53,36,.055)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--restaurant-font-family),Arial,sans-serif;font-size:calc(16px * var(--restaurant-font-scale))}
button{font:inherit;cursor:pointer}
.topbar{height:88px;background:#fff;border-bottom:1px solid var(--line);padding:12px clamp(18px,2.5vw,36px);display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.logo{height:48px;width:48px;border-radius:14px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;font-size:23px;flex:0 0 auto}
.logo img{width:calc(34px * var(--restaurant-logo-scale));height:calc(34px * var(--restaurant-logo-scale));object-fit:contain}
.brand h1{font-size:19px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.02em}
.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}
.clock-wrap{text-align:right;flex:0 0 auto}
.clock{font-size:clamp(25px,3vw,36px);font-weight:800;letter-spacing:-.045em;line-height:1;color:var(--green);font-variant-numeric:tabular-nums}
.clock-date{font-size:12px;color:var(--muted);margin-top:5px}
.live-label{display:inline-flex;align-items:center;gap:7px;color:var(--green);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-top:5px}
.dot{width:7px;height:7px;border-radius:50%;background:#38a65d;box-shadow:0 0 0 3px #e5f4e8}
.wrap{height:calc(100vh - 88px);min-height:440px;padding:18px clamp(12px,1.8vw,26px) 20px;max-width:1900px;margin:0 auto}
.notice{display:none;border:1px solid #f0d5a0;background:#fff9e9;color:#72551e;border-radius:10px;margin-bottom:12px;padding:10px 13px;font-size:12px}
.notice.show{display:block}
.board{height:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.lane{min-width:0;min-height:0;display:flex;flex-direction:column;border:1px solid #e1e8df;border-radius:19px;padding:11px;background:#f9fbf8;box-shadow:0 7px 22px rgba(32,55,37,.085),0 1px 3px rgba(32,55,37,.045)}
.lane.incoming{background:linear-gradient(180deg,#f0f7f0,#f9fbf8 45%)}
.lane.preparing{background:linear-gradient(180deg,#fff7e8,#fcfaf5 45%)}
.lane.ready{background:linear-gradient(180deg,#edf7ed,#f8fbf7 45%)}
.lane.served{background:linear-gradient(180deg,#f3f4f0,#fafaf8 45%)}
.lane-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 7px 13px;flex:0 0 auto}
.lane-title{font-size:clamp(15px,1.35vw,20px);font-weight:800;letter-spacing:-.025em;display:flex;align-items:center;gap:9px}
.lane-icon{width:31px;height:31px;border-radius:10px;background:#fff;display:grid;place-items:center;color:var(--green);font-size:17px;box-shadow:0 2px 7px rgba(0,0,0,.04)}
.preparing .lane-icon{color:#a8751d}.ready .lane-icon{color:#27834a}.served .lane-icon{color:#54705b}
.lane-count{min-width:27px;height:27px;padding:0 8px;border-radius:999px;background:var(--green);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.preparing .lane-count{background:#bd8a34}.served .lane-count{background:#78917d}
.lane-list{overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:10px;padding:0 2px 4px;scrollbar-width:thin;scrollbar-color:#cbd7ca transparent}
.order-card{background:#fff;border:1px solid #e6ebe4;border-radius:15px;box-shadow:0 4px 13px rgba(31,53,36,.075),0 1px 2px rgba(31,53,36,.04);overflow:hidden;min-width:0;flex:0 0 auto;transition:box-shadow .18s ease,transform .18s ease}
.order-card:hover{box-shadow:0 8px 20px rgba(31,53,36,.11),0 2px 5px rgba(31,53,36,.05);transform:translateY(-1px)}
.order-top{padding:13px 13px 9px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.order-main{min-width:0}
.order-number{font-size:16px;font-weight:850;letter-spacing:-.02em}
.order-meta{margin-top:4px;color:#667268;font-size:12px;line-height:1.4;display:flex;gap:5px;flex-wrap:wrap}
.elapsed{flex:0 0 auto;padding:5px 8px;border-radius:999px;background:#fff0e9;color:#b44c32;font-size:11px;font-weight:800;white-space:nowrap}
.preparing .elapsed{background:var(--amber);color:var(--amber-ink)}
.ready .elapsed{background:var(--green-soft);color:var(--green)}
.order-items{padding:0 14px 11px}
.item{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.qty{flex:0 0 auto;font-size:13px;font-weight:850;color:var(--green);min-width:24px}
.itemname{font-size:13px;font-weight:650;line-height:1.35;overflow-wrap:anywhere}
.instructions{margin:6px 0 2px;padding:8px 9px;border-radius:9px;background:#fff8e8;color:#745d2b;font-size:11px;line-height:1.45}
.order-action{padding:0 12px 12px}
.action{width:100%;border:0;background:var(--green);color:#fff;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:800;min-height:39px}
.action:disabled{opacity:.55;cursor:wait}
.served .order-card{opacity:.88}
.served .order-top{padding-bottom:12px}
.served-check{color:#fff;background:#32924e;border-radius:50%;width:23px;height:23px;display:grid;place-items:center;font-size:13px;flex:0 0 auto}
.empty{background:rgba(255,255,255,.65);border:1px dashed #dbe4d9;border-radius:12px;padding:17px 9px;text-align:center;color:#89938a;font-size:11px}
@media(max-width:900px){.wrap{height:auto;min-height:calc(100vh - 80px)}.board{grid-template-columns:repeat(2,minmax(0,1fr))}.lane{min-height:380px}}
@media(max-width:560px){.topbar{height:76px;padding:10px 12px}.logo{width:40px;height:40px}.brand h1{font-size:14px}.brand p{font-size:10px}.clock{font-size:23px}.clock-date{font-size:10px}.wrap{height:auto;padding:10px}.board{grid-template-columns:1fr}.lane{min-height:280px}}
body:not(.restaurant-profile-ready) .brand h1{visibility:hidden!important}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo">✦</div><div><h1>HALINA BISTRO CAFE</h1><p>Dispatcher</p></div></div>
  <div class="clock-wrap">
    <div class="clock" id="restaurantClock">--:--:--</div>
    <div class="clock-date" id="restaurantDate">Loading local time…</div>
    <div class="live-label"><span class="dot"></span> Live</div>
  </div>
</header>
<main class="wrap">
  <div id="notice" class="notice"></div>
  <section class="board" id="ordersBoard">
    <section class="lane incoming"><div class="lane-head"><div class="lane-title"><span class="lane-icon">♧</span>Incoming Orders</div><span class="lane-count" id="incomingCount">0</span></div><div class="lane-list" id="incomingList"><div class="empty">Loading orders…</div></div></section>
    <section class="lane preparing"><div class="lane-head"><div class="lane-title"><span class="lane-icon">♨</span>Preparing</div><span class="lane-count" id="preparingCount">0</span></div><div class="lane-list" id="preparingList"><div class="empty">Loading orders…</div></div></section>
    <section class="lane ready"><div class="lane-head"><div class="lane-title"><span class="lane-icon">□</span>Ready</div><span class="lane-count" id="readyCount">0</span></div><div class="lane-list" id="readyList"><div class="empty">Loading orders…</div></div></section>
    <section class="lane served"><div class="lane-head"><div class="lane-title"><span class="lane-icon">✓</span>Served</div><span class="lane-count" id="servedCount">0</span></div><div class="lane-list" id="servedList"><div class="empty">No served orders yet</div></div></section>
  </section>
</main>
<script>
/* HALINA BISTRO CAFE — Dispatcher
   Uses the existing public.orders and public.order_items tables.
   Publishable key is intended for client-side use; protect data with Supabase RLS. */
const SUPABASE_URL = "https://isqcuycjrbjtmqhzckvb.supabase.co";
const SUPABASE_KEY = "sb_publishable_PM2N85UZqFZqc-2XQ04IPg_ulOxQkt4";
const RESTAURANT_ID = "5e562ca7-38aa-4894-8265-ddca2f4e61b6";
const grid = document.getElementById('ordersBoard');
const notice = document.getElementById('notice');
let allOrders = [];
let servedOrders = [];
let activeFilter = 'active';
let busyIds = new Set();
const terminalStatuses = ['completed','cancelled','served','dispatched'];
function safe(v){return String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normalizeStatus(order){return String(order.status || order.order_status || 'pending').trim().toLowerCase();}
function isOpen(order){return !terminalStatuses.includes(normalizeStatus(order));}
function isNew(status){return ['pending','new','accepted','confirmed'].includes(status);}
function  prettyStatus(status) {
  if (
    status === "pending" ||
    status === "new" ||
    status === "accepted" ||
    status === "confirmed"
  ) {
    return "NEW ORDER";
  }

  if (status === "preparing") {
    return "PREPARING";
  }

  if (status === "ready") {
    return "READY";
  }

  return status.replace(/_/g, " ").toUpperCase();
}
function timeLabel(value){if(!value)return 'Time unavailable';const d=new Date(value);if(Number.isNaN(d.getTime()))return 'Time unavailable';return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});}
function orderItems(order){let items=order.items;if(typeof items==='string'){try{items=JSON.parse(items)}catch{items=[]}}if(items && !Array.isArray(items) && Array.isArray(items.items))items=items.items;if(!Array.isArray(items))items=[];return items.map(it=>({name:it.item_name||it.name||it.title||it.product_name||'Menu item',qty:Number(it.quantity??it.qty??1)||1,instructions:it.special_instructions||it.instructions||''}));}
function setNotice(message){notice.textContent=message;notice.classList.toggle('show',Boolean(message));}
async function api(path,options={}){const response=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...options,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',...(options.headers||{})}});const text=await response.text();let data;try{data=text?JSON.parse(text):null}catch{data=text}if(!response.ok)throw new Error(data?.message||data?.details||data?.hint||String(data||'Supabase request failed'));return data;}
async function loadOrders(){try{
  const rows=await api('orders?select=id,restaurant_id,order_number,table_number,table_id,order_type,items,status,order_status,special_instructions,created_at&restaurant_id=eq.'+encodeURIComponent(RESTAURANT_ID)+'&order=created_at.desc&limit=100');
  const source=Array.isArray(rows)?rows:[];
  servedOrders=source.filter(o=>normalizeStatus(o)==='served').slice(0,30);
  const open=source.filter(isOpen);
  // Prefer items stored on orders.items. Fetch order_items only for orders whose JSON items are absent/empty.
  const needRows=open.filter(o=>orderItems(o).length===0);
  if(needRows.length){try{const ids=needRows.map(o=>o.id).filter(Boolean);if(ids.length){const encoded=ids.map(id=>`"${id}"`).join(',');const itemRows=await api('order_items?select=order_id,item_name,quantity,special_instructions&order_id=in.('+encoded+')&order=created_at.asc');const byOrder=new Map();for(const item of (Array.isArray(itemRows)?itemRows:[])){if(!byOrder.has(item.order_id))byOrder.set(item.order_id,[]);byOrder.get(item.order_id).push({name:item.item_name||'Menu item',qty:Number(item.quantity)||1,instructions:item.special_instructions||''});}for(const o of needRows){if(byOrder.has(o.id))o._fallbackItems=byOrder.get(o.id);}}}catch(e){console.warn('Could not load order_items fallback:',e.message)}}
  allOrders=open;render();setNotice('');
 }catch(e){console.error('Dispatcher load error:',e);setNotice('Could not load orders: '+e.message+'. Check that the Supabase API key and SELECT policies allow this dashboard to read orders and order_items.');if(!allOrders.length){['incomingList','preparingList','readyList','servedList'].forEach(id=>document.getElementById(id).innerHTML='<div class="empty">Orders could not be loaded. Check the connection.</div>');}}}
function render(){
  const groups={
    incoming:allOrders.filter(o=>isNew(normalizeStatus(o))),
    preparing:allOrders.filter(o=>normalizeStatus(o)==='preparing'),
    ready:allOrders.filter(o=>normalizeStatus(o)==='ready'),
    served:servedOrders
  };
  for(const [key,orders] of Object.entries(groups)){
    const list=document.getElementById(key+'List');
    document.getElementById(key+'Count').textContent=orders.length;
    if(!orders.length){list.innerHTML='<div class="empty">'+(key==='served'?'No served orders yet':'No orders in this stage')+'</div>';continue;}
    list.innerHTML=orders.map(o=>renderCard(o,key==='served')).join('');
  }
  document.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>updateStatus(btn.dataset.id,btn.dataset.action,btn)));
}
function renderCard(o,isServed=false) {
  const status=normalizeStatus(o);
  const items=o._fallbackItems||orderItems(o);
  const table=o.table_number||'No table';
  const number=o.order_number!=null?'#'+o.order_number:'#'+String(o.id||'').slice(0,8);
  const type=String(o.order_type||'dine_in').replace(/_/g,' ').replace(/^\\w/,c=>c.toUpperCase());
  const elapsed=(()=>{const d=new Date(o.created_at);if(Number.isNaN(d.getTime()))return '';const mins=Math.max(0,Math.floor((Date.now()-d.getTime())/60000));return mins<1?'Just now':mins+' min';})();
  const instructions=o.special_instructions?`<div class="instructions"><strong>Order note:</strong> ${safe(o.special_instructions)}</div>`:'';
  const itemHtml=items.length?items.map(it=>`<div class="item"><div class="qty">${safe(it.qty)}×</div><div class="itemname">${safe(it.name)}${it.instructions?`<div class="instructions">${safe(it.instructions)}</div>`:''}</div></div>`).join(''):'<div class="item"><div class="itemname">No item details</div></div>';
  let action='';
  if(!isServed&&isNew(status))action=`<button class="action" data-action="preparing" data-id="${safe(o.id)}">Accept & Start Preparing</button>`;
  else if(!isServed&&status==='preparing')action=`<button class="action" data-action="ready" data-id="${safe(o.id)}">Mark Ready</button>`;
  else if(!isServed&&status==='ready')action=`<button class="action" data-action="served" data-id="${safe(o.id)}">Mark Served</button>`;
  return `<article class="order-card"><div class="order-top"><div class="order-main"><div class="order-number">${safe(number)}</div><div class="order-meta"><span>${safe(type)}</span><span>·</span><span>${safe(table)}</span></div></div>${isServed?'<span class="served-check">✓</span>':`<span class="elapsed">${safe(elapsed)}</span>`}</div><div class="order-items">${itemHtml}${instructions}</div>${action?`<div class="order-action">${action}</div>`:''}</article>`;
}
  async function updateStatus(id,status,button){if(!id||busyIds.has(id))return;const label=button.textContent;busyIds.add(id);button.disabled=true;button.textContent='Updating…';try{const updated=await api('orders?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({status})});if(!Array.isArray(updated)||!updated.length)throw new Error('No order was updated. Check the Supabase UPDATE policy.');await loadOrders();}catch(e){setNotice('Could not update order status: '+e.message);button.disabled=false;button.textContent=label;}finally{busyIds.delete(id);}}
const refreshButton=document.getElementById('refreshBtn');if(refreshButton)refreshButton.addEventListener('click',loadOrders);const filtersElement=document.getElementById('filters');if(filtersElement)filtersElement.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;activeFilter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render();});
loadOrders();setInterval(loadOrders,10000);
</script>

<!-- CENTRAL RESTAURANT PROFILE CONNECTION -->
<script>
/* CENTRAL RESTAURANT BRANDING — restaurants is the single source of truth. */
(function () {
  const API = 'https://isqcuycjrbjtmqhzckvb.supabase.co/rest/v1/restaurants';
  const KEY = 'sb_publishable_PM2N85UZqFZqc-2XQ04IPg_ulOxQkt4';
  const RESTAURANT_ID = '5e562ca7-38aa-4894-8265-ddca2f4e61b6';
  const NAME_SELECTORS = ['.brand h1'];
  const LOGO_MODE = 'dispatcher';
  function setName(el, name) {
    if (!el || !name) return;
    let img = el.querySelector(':scope > img[data-restaurant-logo]');
    el.textContent = '';
    if (img) el.appendChild(img);
    el.appendChild(document.createTextNode(name));
  }
  function setInlineLogo(el, url) {
    if (!el || !url) return;
    let img = el.querySelector(':scope > img[data-restaurant-logo]');
    if (!img) {
      img = document.createElement('img');
      img.dataset.restaurantLogo = 'true';
      img.alt = 'Restaurant logo';
      img.loading = 'eager';
      img.style.cssText = 'width:30px;height:30px;object-fit:contain;border-radius:8px;vertical-align:middle;margin-right:9px';
      el.insertBefore(img, el.firstChild);
    }
    img.src = url;
  }
  function setDispatcherLogo(url) {
    const mark = document.querySelector('.brand .logo');
    if (!mark || !url) return;
    let img = mark.querySelector(':scope > img[data-restaurant-logo]');
    if (!img) {
      mark.textContent = '';
      img = document.createElement('img');
      img.dataset.restaurantLogo = 'true';
      img.alt = 'Restaurant logo';
      img.loading = 'eager';
      img.style.cssText = 'width:34px;height:34px;object-fit:contain;border-radius:9px;display:block';
      mark.appendChild(img);
    }
    img.src = url;
  }
  function replaceRestaurantNameInTextNodes(name, root = document.body) {
    if (!name || !root) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        const parent = node.parentElement;
        if (!parent || /^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA|INPUT)$/i.test(parent.tagName)) return NodeFilter.FILTER_REJECT;
        return /HALINA BISTRO CAFE/i.test(node.nodeValue || '') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => { node.nodeValue = node.nodeValue.replace(/HALINA BISTRO CAFE/gi, name); });
  }
  let restaurantNameObserver;
  function watchRestaurantName(name) {
    if (!name || !document.body || restaurantNameObserver) return;
    restaurantNameObserver = new MutationObserver(() => replaceRestaurantNameInTextNodes(name));
    restaurantNameObserver.observe(document.body, { childList: true, subtree: true, characterData: true });
  }
  function applyProfile(profile) {
    if (!profile) return;
    const appearance = profile.appearance_settings || {};
    const fontMap = {Inter:'Inter, Arial, sans-serif',Roboto:'Roboto, Arial, sans-serif',Poppins:'Poppins, Arial, sans-serif',Montserrat:'Montserrat, Arial, sans-serif',Lato:'Lato, Arial, sans-serif'};
    const font = fontMap[appearance.font_family] || fontMap.Inter;
    const scale = Math.min(1.15, Math.max(0.9, Number(appearance.font_scale) || 1));
    const logoScale = Math.min(1.5, Math.max(0.8, Number(appearance.logo_scale) || 1.15));
    document.documentElement.style.setProperty('--restaurant-font-family', font);
    document.documentElement.style.setProperty('--restaurant-font-scale', String(scale));
    document.documentElement.style.setProperty('--restaurant-logo-scale', String(logoScale));
    const name = String(profile.name || '').trim();
    if (name) {
      document.body.classList.add('restaurant-profile-ready');
      document.querySelectorAll(NAME_SELECTORS.join(',')).forEach(el => setName(el, name));
      document.title = `${name} — Dispatcher`;
      replaceRestaurantNameInTextNodes(name);
      watchRestaurantName(name);
    }
    if (profile.logo_url) {
      if (LOGO_MODE === 'dispatcher') setDispatcherLogo(profile.logo_url);
      else document.querySelectorAll(NAME_SELECTORS.join(',')).forEach(el => setInlineLogo(el, profile.logo_url));
    }
    window.HALINA_RESTAURANT_PROFILE = profile;
  }
  window.applyRestaurantBranding = applyProfile;
  async function connect() {
    try {
      const response = await fetch(API + '?id=eq.' + RESTAURANT_ID + '&select=name,logo_url,address,contact_number,email,website,currency,timezone,tax_rate,appearance_settings', {
        headers: { apikey: KEY, Authorization: 'Bearer ' + KEY }, cache: 'no-store'
      });
      if (!response.ok) throw new Error('Profile request failed: ' + response.status);
      const rows = await response.json();
      const profile = rows && rows[0];
      if (!profile) return;
      applyProfile(profile);
      window.dispatchEvent(new CustomEvent('restaurantprofileloaded', { detail: profile }));
    } catch (error) {
      console.warn('Could not load centralized restaurant profile:', error);
    }
  }
  window.addEventListener('restaurantprofilechanged', e => applyProfile(e.detail));
  window.addEventListener('focus', connect);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) connect(); });
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', connect, { once: true });
  else connect();
})();
</script>
