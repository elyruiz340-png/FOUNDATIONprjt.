<!doctype html>
<html lang="en">
<head>
  <script src="./halina-config.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatcher</title>
<style>
:root{--restaurant-font-family:Inter,"Segoe UI Variable",Segoe UI,Aptos,Arial,sans-serif;--restaurant-font-scale:1;--restaurant-logo-scale:1.15;--bg:#f3f6f2;--panel:#fff;--ink:#172b20;--muted:#718076;--line:#dfe8df;--green:#236b3d;--green-soft:#eaf3e9;--amber:#a87522;--amber-soft:#fff5e4;--shadow:0 8px 22px rgba(30,55,38,.065),0 2px 5px rgba(30,55,38,.035)}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:linear-gradient(180deg,#f7f9f6 0%,var(--bg) 100%);color:var(--ink);font-family:var(--restaurant-font-family);font-size:calc(16px * var(--restaurant-font-scale));-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}button{font:inherit;cursor:pointer}
.topbar{height:72px;min-height:72px;background:rgba(255,255,255,.97);border-bottom:1px solid #e4ebe3;padding:7px clamp(16px,2.2vw,30px);display:flex;align-items:center;justify-content:space-between;gap:18px;box-shadow:0 2px 12px rgba(31,53,36,.035)}
.brand-block{display:flex;align-items:center;gap:12px;min-width:0}.logo{height:40px;width:40px;border-radius:11px;background:linear-gradient(145deg,#edf6ed,#dcebdd);border:1px solid #dbe8da;color:var(--green);display:grid;place-items:center;font-size:20px;flex:0 0 auto;box-shadow:inset 0 1px 0 #fff,0 2px 6px rgba(35,82,48,.055);overflow:hidden}.logo img{width:calc(32px * var(--restaurant-logo-scale));height:calc(32px * var(--restaurant-logo-scale));object-fit:contain}.brand-copy{min-width:0}.brand h1{font-size:clamp(18px,1.7vw,22px);line-height:1.1;margin:0;font-weight:850;letter-spacing:-.04em;color:#1b3325;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock-panel{display:flex;align-items:center;gap:12px;min-width:0;padding:7px 13px;border:1px solid #e1e9e1;border-radius:999px;background:linear-gradient(145deg,#fff 0%,#f7faf6 100%);box-shadow:inset 0 1px 0 #fff,0 3px 10px rgba(31,53,36,.045);flex:0 0 auto}.clock-divider{width:1px;height:23px;background:#dce6dc;flex:0 0 auto}.live-label{display:inline-flex;align-items:center;gap:6px;color:#267746;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#32a15a;box-shadow:0 0 0 3px rgba(50,161,90,.12);animation:livePulse 2.2s ease-in-out infinite}@keyframes livePulse{0%,100%{box-shadow:0 0 0 2px rgba(50,161,90,.10)}50%{box-shadow:0 0 0 5px rgba(50,161,90,.17)}}
.clock-main{display:flex;align-items:baseline;justify-content:center;gap:4px;line-height:1;white-space:nowrap}.clock{font-family:var(--restaurant-font-family);font-size:clamp(20px,2vw,25px);font-weight:850;letter-spacing:-.055em;line-height:1;color:#1d5834;font-variant-numeric:tabular-nums lining-nums;text-shadow:0 1px 0 rgba(255,255,255,.9);white-space:nowrap}.clock-period{font-size:11px;font-weight:850;letter-spacing:.01em;color:#5f8168;white-space:nowrap}.clock-date{font-size:10px;color:#596b5e;font-weight:750;white-space:nowrap}.timezone-chip{display:none}
.wrap{height:calc(100vh - 72px);min-height:480px;padding:14px clamp(12px,1.8vw,26px) 16px;max-width:1920px;margin:0 auto}.notice{display:none;border:1px solid #f0d5a0;background:#fff9e9;color:#72551e;border-radius:12px;margin-bottom:13px;padding:11px 14px;font-size:13px;font-weight:650}.notice.show{display:block}
.board{height:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.13fr);gap:15px;align-items:stretch}.lane{min-width:0;min-height:0;display:flex;flex-direction:column;border:1px solid #e0e8df;border-radius:17px;padding:0;background:linear-gradient(180deg,#fbfdfb 0%,#f7faf7 100%);box-shadow:var(--shadow);overflow:hidden}.lane.incoming{background:linear-gradient(180deg,#f1f8f1 0%,#fbfdfb 46%)}.lane.preparing{background:linear-gradient(180deg,#fff8eb 0%,#fffdfa 46%);border-color:#eee4d1}.lane.ready{background:linear-gradient(180deg,#eef7f0 0%,#fbfdfb 46%)}.lane.served{background:linear-gradient(180deg,#f0f5ef 0%,#fafcf9 46%)}
.lane-head{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 48px;min-height:56px;height:56px;flex:0 0 56px;border-bottom:1px solid rgba(220,230,219,.85);margin:0}
.lane-title{position:static;width:100%;min-width:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(15px,1.18vw,18px);font-weight:850;letter-spacing:-.025em;line-height:1.1;color:inherit;margin:0}
.lane-title-text{display:block;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lane-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.75);display:grid;place-items:center;color:#236b3d;flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.045)}
.lane-icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.lane-count{position:absolute;right:10px;top:50%;transform:translateY(-50%);min-width:27px;height:27px;padding:0 8px;border-radius:999px;background:rgba(255,255,255,.95);color:#1e6339;font-size:12px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;box-shadow:0 1px 4px rgba(0,0,0,.07);flex:0 0 auto}
.lane.incoming .lane-head{background:linear-gradient(110deg,#1b6038 0%,#267647 100%);border-bottom-color:#1d6039}.lane.incoming .lane-title{color:#fff}.lane.incoming .lane-icon{color:#1e6339}
.lane.preparing .lane-head{background:linear-gradient(110deg,#bd831e 0%,#dca13a 100%);border-bottom-color:#b77d1d}.lane.preparing .lane-title{color:#fff}.lane.preparing .lane-icon{color:#a87522}.lane.preparing .lane-count{color:#946719}
.lane.ready .lane-head{background:linear-gradient(110deg,#348647 0%,#4e9d56 100%);border-bottom-color:#348647}.lane.ready .lane-title{color:#fff}.lane.ready .lane-icon{color:#28804a}
.lane.served .lane-head{background:linear-gradient(110deg,#174f30 0%,#236b3d 100%);border-bottom-color:#174f30}.lane.served .lane-title{color:#fff}.lane.served .lane-icon{color:#1f6a3d}.lane.served .lane-count{background:#fff;color:#205f38}
.lane-list{overflow:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:11px;padding:12px 12px 7px;scrollbar-width:thin;scrollbar-color:#c4d2c4 transparent}.lane-list::-webkit-scrollbar{width:7px}.lane-list::-webkit-scrollbar-thumb{background:#c7d5c7;border-radius:99px}.lane-list::-webkit-scrollbar-track{background:transparent}
.order-card{background:rgba(255,255,255,.97);border:1px solid #e3ebe2;border-radius:16px;box-shadow:0 3px 10px rgba(31,53,36,.055),0 1px 2px rgba(31,53,36,.025);overflow:hidden;min-width:0;flex:0 0 auto;transition:box-shadow .18s ease,transform .18s ease,border-color .18s ease}.order-card:hover{box-shadow:0 8px 18px rgba(31,53,36,.09),0 2px 4px rgba(31,53,36,.04);transform:translateY(-1px);border-color:#cddfce}.order-top{padding:13px 14px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.order-main{min-width:0}.order-number{font-size:20px;font-weight:900;letter-spacing:-.045em;line-height:1.08;color:#172b20;font-variant-numeric:tabular-nums}.order-meta{margin-top:6px;color:#68786d;font-size:12px;font-weight:700;line-height:1.45;display:flex;gap:5px 9px;flex-wrap:wrap;align-items:center}.order-meta span{display:inline-flex;align-items:center;gap:4px}.order-meta .meta-time{color:#89958c;font-weight:650}.elapsed{flex:0 0 auto;padding:6px 9px;border-radius:999px;background:#fff0e9;color:#b44c32;font-size:11px;font-weight:850;white-space:nowrap;font-variant-numeric:tabular-nums}.preparing .elapsed{background:var(--amber-soft);color:#946719}.ready .elapsed{background:var(--green-soft);color:var(--green)}
.order-items{padding:2px 14px 12px}.item{display:grid;grid-template-columns:31px minmax(0,1fr);gap:7px;align-items:start;padding:7px 0;border-top:1px solid #f0f3ee}.item:first-child{border-top:0}.qty{font-size:13px;font-weight:900;color:#27834a;line-height:1.5;text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}.itemname{font-size:14px;font-weight:680;line-height:1.45;color:#314238;overflow-wrap:anywhere}.instructions{margin:7px 0 2px;padding:9px 10px;border-radius:10px;background:#fff8e8;color:#745d2b;font-size:12px;line-height:1.45;border:1px solid #f3e7cc}.order-action{padding:0 13px 13px}.action{width:100%;border:0;background:linear-gradient(180deg,#2d9252,#207a40);color:#fff;border-radius:11px;padding:12px;font-size:13px;font-weight:850;letter-spacing:.005em;min-height:43px;box-shadow:0 3px 8px rgba(31,132,69,.17);transition:filter .15s ease,transform .15s ease,box-shadow .15s ease}.action:hover:not(:disabled){filter:brightness(1.04);transform:translateY(-1px);box-shadow:0 5px 11px rgba(31,132,69,.21)}.action:active:not(:disabled){transform:translateY(0)}.action:focus-visible{outline:3px solid rgba(35,132,71,.25);outline-offset:2px}.action:disabled{opacity:.55;cursor:wait;box-shadow:none}
.served .order-card{opacity:1}.served .order-top{padding-bottom:9px}.served .order-number{font-size:18px}.served .itemname{font-size:13px}.served .qty{font-size:12px;min-width:24px}.served-check{color:#fff;background:#32924e;border-radius:50%;width:25px;height:25px;display:grid;place-items:center;font-size:13px;flex:0 0 auto;box-shadow:0 2px 5px rgba(50,146,78,.18)}.empty{background:rgba(255,255,255,.76);border:1px dashed #d5e2d5;border-radius:13px;padding:19px 11px;text-align:center;color:#839087;font-size:12px;font-weight:650;line-height:1.45}
@media(max-width:1100px){.topbar{height:68px;min-height:68px}.clock-panel{gap:8px;padding:6px 10px}.clock{font-size:20px}.clock-date{font-size:9px}.wrap{height:auto;min-height:calc(100vh - 68px)}.board{height:auto;grid-template-columns:repeat(2,minmax(0,1fr))}.lane{min-height:430px}.lane.served{grid-column:span 2}.lane-title{font-size:19px}}
@media(max-width:680px){.topbar{height:auto;min-height:68px;align-items:center;gap:8px;padding:8px 10px}.brand-block{gap:8px}.logo{height:34px;width:34px}.brand h1{font-size:clamp(13px,3.4vw,18px)}.clock-panel{gap:6px;padding:5px 7px}.clock-divider{height:18px}.clock{font-size:clamp(15px,4vw,19px)}.clock-period{font-size:9px}.clock-date{font-size:8px}.live-label{font-size:8px;gap:4px}.dot{width:6px;height:6px}.wrap{height:auto;padding:10px}.board{grid-template-columns:minmax(0,1fr);gap:10px}.lane,.lane.served{grid-column:auto;min-height:300px}.lane-title{font-size:16px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand-block">
    <div class="logo" aria-label="Restaurant logo">✦</div>
    <div class="brand-copy"><h1>HALINA BISTRO CAFE</h1></div>
  </div>
  <section class="clock-panel" aria-label="Restaurant local time">
    <span class="live-label" id="clockLiveStatus"><span class="dot"></span> LIVE</span>
    <span class="clock-divider" aria-hidden="true"></span>
    <div class="clock-main"><span class="clock" id="restaurantClock" aria-live="off">--:--</span><span class="clock-period" id="clockPeriod">--</span></div>
    <span class="clock-divider" aria-hidden="true"></span>
    <span class="clock-date" id="restaurantDate">Loading…</span>
    <span class="timezone-chip" id="restaurantTimezone" hidden>TIMEZONE</span>
  </section>
</header>
<main class="wrap">
  <div id="notice" class="notice"></div>
  <section class="board" id="ordersBoard">
    <section class="lane incoming" aria-labelledby="incomingHeading">
      <div class="lane-head"><span class="lane-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 13.5h4l2 3h4l2-3h4"/><path d="M5 13.5 7 5h10l2 8.5"/><path d="M12 8v5m-2-2 2 2 2-2"/></svg></span><h2 class="lane-title" id="incomingHeading"><span class="lane-title-text">Incoming Orders</span></h2><span class="lane-count" id="incomingCount">0</span></div>
      <div class="lane-list" id="incomingList"><div class="empty">Loading orders…</div></div>
    </section>
    <section class="lane preparing" aria-labelledby="preparingHeading">
      <div class="lane-head"><span class="lane-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 15.5h14l-1.2 4H6.2l-1.2-4Z"/><path d="M7 15.5a5 5 0 0 1 10 0"/><path d="M9 9c-1-1 1-2 0-3m4 3c-1-1 1-2 0-3m4 3c-1-1 1-2 0-3"/></svg></span><h2 class="lane-title" id="preparingHeading"><span class="lane-title-text">Preparing</span></h2><span class="lane-count" id="preparingCount">0</span></div>
      <div class="lane-list" id="preparingList"><div class="empty">No orders in this stage</div></div>
    </section>
    <section class="lane ready" aria-labelledby="readyHeading">
      <div class="lane-head"><span class="lane-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8 12.2 2.6 2.6 5.5-5.7"/></svg></span><h2 class="lane-title" id="readyHeading"><span class="lane-title-text">Ready</span></h2><span class="lane-count" id="readyCount">0</span></div>
      <div class="lane-list" id="readyList"><div class="empty">No orders in this stage</div></div>
    </section>
    <section class="lane served" aria-labelledby="servedHeading">
      <div class="lane-head"><span class="lane-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5 9.2 17 19 7"/><path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5"/></svg></span><h2 class="lane-title" id="servedHeading"><span class="lane-title-text">Served</span></h2><span class="lane-count" id="servedCount">0</span></div>
      <div class="lane-list" id="servedList"><div class="empty">No served orders yet</div></div>
    </section>
  </section>
</main>
<script>
/* HALINA BISTRO CAFE — Dispatcher
   Uses the existing public.orders and public.order_items tables.
   Publishable key is intended for client-side use; protect data with Supabase RLS. */
const SUPABASE_URL = "https://isqcuycjrbjtmqhzckvb.supabase.co";
const SUPABASE_KEY = "sb_publishable_PM2N85UZqFZqc-2XQ04IPg_ulOxQkt4";
const RESTAURANT_ID = "5e562ca7-38aa-4894-8265-ddca2f4e61b6";
const grid = document.getElementById('ordersBoard');
const notice = document.getElementById('notice');
let allOrders = [];
let servedOrders = [];
let activeFilter = 'active';
let busyIds = new Set();
const terminalStatuses = ['completed','cancelled','served','dispatched'];
function safe(v){return String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normalizeStatus(order){return String(order.status || order.order_status || 'pending').trim().toLowerCase();}
function isOpen(order){return !terminalStatuses.includes(normalizeStatus(order));}
function isNew(status){return ['pending','new','accepted','confirmed'].includes(status);}
function  prettyStatus(status) {
  if (
    status === "pending" ||
    status === "new" ||
    status === "accepted" ||
    status === "confirmed"
  ) {
    return "NEW ORDER";
  }

  if (status === "preparing") {
    return "PREPARING";
  }

  if (status === "ready") {
    return "READY";
  }

  return status.replace(/_/g, " ").toUpperCase();
}
function timeLabel(value){
  if(!value)return 'Time unavailable';
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return 'Time unavailable';
  const timezone=String(window.HALINA_RESTAURANT_PROFILE?.timezone||'').trim();
  try{return new Intl.DateTimeFormat('en-US',{hour:'numeric',minute:'2-digit',timeZone:timezone||undefined}).format(d);}
  catch(error){return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});}
}
function orderItems(order){let items=order.items;if(typeof items==='string'){try{items=JSON.parse(items)}catch{items=[]}}if(items && !Array.isArray(items) && Array.isArray(items.items))items=items.items;if(!Array.isArray(items))items=[];return items.map(it=>({name:it.item_name||it.name||it.title||it.product_name||'Menu item',qty:Number(it.quantity??it.qty??1)||1,instructions:it.special_instructions||it.instructions||''}));}
function setNotice(message){notice.textContent=message;notice.classList.toggle('show',Boolean(message));}
async function api(path,options={}){const response=await fetch(SUPABASE_URL+'/rest/v1/'+path,{...options,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',...(options.headers||{})}});const text=await response.text();let data;try{data=text?JSON.parse(text):null}catch{data=text}if(!response.ok)throw new Error(data?.message||data?.details||data?.hint||String(data||'Supabase request failed'));return data;}
async function loadOrders(){try{
  const rows=await api('orders?select=id,restaurant_id,order_number,table_number,table_id,order_type,items,status,order_status,special_instructions,created_at&restaurant_id=eq.'+encodeURIComponent(RESTAURANT_ID)+'&order=created_at.desc&limit=100');
  const source=Array.isArray(rows)?rows:[];
  servedOrders=source.filter(o=>normalizeStatus(o)==='served').slice(0,30);
  const open=source.filter(isOpen);
  // Prefer items stored on orders.items. Fetch order_items only for orders whose JSON items are absent/empty.
  const needRows=open.filter(o=>orderItems(o).length===0);
  if(needRows.length){try{const ids=needRows.map(o=>o.id).filter(Boolean);if(ids.length){const encoded=ids.map(id=>`"${id}"`).join(',');const itemRows=await api('order_items?select=order_id,item_name,quantity,special_instructions&order_id=in.('+encoded+')&order=created_at.asc');const byOrder=new Map();for(const item of (Array.isArray(itemRows)?itemRows:[])){if(!byOrder.has(item.order_id))byOrder.set(item.order_id,[]);byOrder.get(item.order_id).push({name:item.item_name||'Menu item',qty:Number(item.quantity)||1,instructions:item.special_instructions||''});}for(const o of needRows){if(byOrder.has(o.id))o._fallbackItems=byOrder.get(o.id);}}}catch(e){console.warn('Could not load order_items fallback:',e.message)}}
  allOrders=open;render();setNotice('');
 }catch(e){console.error('Dispatcher load error:',e);setNotice('Could not load orders: '+e.message+'. Check that the Supabase API key and SELECT policies allow this dashboard to read orders and order_items.');if(!allOrders.length){['incomingList','preparingList','readyList','servedList'].forEach(id=>document.getElementById(id).innerHTML='<div class="empty">Orders could not be loaded. Check the connection.</div>');}}}
function render(){
  const groups={
    incoming:allOrders.filter(o=>isNew(normalizeStatus(o))),
    preparing:allOrders.filter(o=>normalizeStatus(o)==='preparing'),
    ready:allOrders.filter(o=>normalizeStatus(o)==='ready'),
    served:servedOrders
  };
  for(const [key,orders] of Object.entries(groups)){
    const list=document.getElementById(key+'List');
    document.getElementById(key+'Count').textContent=orders.length;
    if(!orders.length){list.innerHTML='<div class="empty">'+(key==='served'?'No served orders yet':'No orders in this stage')+'</div>';continue;}
    list.innerHTML=orders.map(o=>renderCard(o,key==='served')).join('');
  }
  document.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>updateStatus(btn.dataset.id,btn.dataset.action,btn)));
}
function renderCard(o,isServed=false) {
  const status=normalizeStatus(o);
  const items=o._fallbackItems||orderItems(o);
  const table=o.table_number||'No table';
  const number=o.order_number!=null?'#'+o.order_number:'#'+String(o.id||'').slice(0,8);
  const type=String(o.order_type||'dine_in').replace(/_/g,' ').replace(/^\\w/,c=>c.toUpperCase());
  const elapsed=(()=>{const d=new Date(o.created_at);if(Number.isNaN(d.getTime()))return '';const mins=Math.max(0,Math.floor((Date.now()-d.getTime())/60000));return mins<1?'Just now':mins+' min';})();
  const instructions=o.special_instructions?`<div class="instructions"><strong>Order note:</strong> ${safe(o.special_instructions)}</div>`:'';
  const itemHtml=items.length?items.map(it=>`<div class="item"><div class="qty">${safe(it.qty)}×</div><div class="itemname">${safe(it.name)}${it.instructions?`<div class="instructions">${safe(it.instructions)}</div>`:''}</div></div>`).join(''):'<div class="item"><div class="itemname">No item details</div></div>';
  let action='';
  if(!isServed&&isNew(status))action=`<button class="action" data-action="preparing" data-id="${safe(o.id)}">Accept & Start Preparing</button>`;
  else if(!isServed&&status==='preparing')action=`<button class="action" data-action="ready" data-id="${safe(o.id)}">Mark Ready</button>`;
  else if(!isServed&&status==='ready')action=`<button class="action" data-action="served" data-id="${safe(o.id)}">Mark Served</button>`;
  return `<article class="order-card"><div class="order-top"><div class="order-main"><div class="order-number">${safe(number)}</div><div class="order-meta"><span>${safe(type)}</span><span>Table ${safe(table)}</span><span class="meta-time">${safe(timeLabel(o.created_at))}</span></div></div>${isServed?'<span class="served-check" aria-label="Served">✓</span>':`<span class="elapsed">${safe(elapsed)}</span>`}</div><div class="order-items">${itemHtml}${instructions}</div>${action?`<div class="order-action">${action}</div>`:''}</article>`;
}
async function updateStatus(id,status,button){
  if(!id||busyIds.has(id))return;
  const label=button.textContent;
  busyIds.add(id);
  button.disabled=true;
  button.textContent='Updating…';
  try{
    // Record the completion timestamp only when an order is marked Served.
    // Other status transitions retain their existing payload and behavior.
    const updatePayload = status === 'served'
      ? { status, completed_at: new Date().toISOString() }
      : { status };
    const updated=await api('orders?id=eq.'+encodeURIComponent(id),{
      method:'PATCH',
      headers:{Prefer:'return=representation'},
      body:JSON.stringify(updatePayload)
    });
    if(!Array.isArray(updated)||!updated.length)throw new Error('No order was updated. Check the Supabase UPDATE policy.');
    await loadOrders();
  }catch(e){
    setNotice('Could not update order status: '+e.message);
    button.disabled=false;
    button.textContent=label;
  }finally{
    busyIds.delete(id);
  }
}

<!-- CENTRAL RESTAURANT PROFILE CONNECTION -->
<script>
/* CENTRAL RESTAURANT BRANDING — restaurants is the single source of truth. */
(function () {
  const API = 'https://isqcuycjrbjtmqhzckvb.supabase.co/rest/v1/restaurants';
  const KEY = 'sb_publishable_PM2N85UZqFZqc-2XQ04IPg_ulOxQkt4';
  const RESTAURANT_ID = '5e562ca7-38aa-4894-8265-ddca2f4e61b6';
  const NAME_SELECTORS = ['.brand-copy h1'];
  const LOGO_MODE = 'dispatcher';
  function setName(el, name) {
    if (!el || !name) return;
    let img = el.querySelector(':scope > img[data-restaurant-logo]');
    el.textContent = '';
    if (img) el.appendChild(img);
    el.appendChild(document.createTextNode(name));
  }
  function setInlineLogo(el, url) {
    if (!el || !url) return;
    let img = el.querySelector(':scope > img[data-restaurant-logo]');
    if (!img) {
      img = document.createElement('img');
      img.dataset.restaurantLogo = 'true';
      img.alt = 'Restaurant logo';
      img.loading = 'eager';
      img.style.cssText = 'width:30px;height:30px;object-fit:contain;border-radius:8px;vertical-align:middle;margin-right:9px';
      el.insertBefore(img, el.firstChild);
    }
    img.src = url;
  }
  function setDispatcherLogo(url) {
    const mark = document.querySelector('.brand-block .logo');
    if (!mark || !url) return;
    let img = mark.querySelector(':scope > img[data-restaurant-logo]');
    if (!img) {
      mark.textContent = '';
      img = document.createElement('img');
      img.dataset.restaurantLogo = 'true';
      img.alt = 'Restaurant logo';
      img.loading = 'eager';
      img.style.cssText = 'width:34px;height:34px;object-fit:contain;border-radius:9px;display:block';
      mark.appendChild(img);
    }
    img.src = url;
  }
  function replaceRestaurantNameInTextNodes(name, root = document.body) {
    if (!name || !root) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        const parent = node.parentElement;
        if (!parent || /^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA|INPUT)$/i.test(parent.tagName)) return NodeFilter.FILTER_REJECT;
        return /HALINA BISTRO CAFE/i.test(node.nodeValue || '') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      }
    });
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => { node.nodeValue = node.nodeValue.replace(/HALINA BISTRO CAFE/gi, name); });
  }
  let restaurantNameObserver;
  function watchRestaurantName(name) {
    if (!name || !document.body || restaurantNameObserver) return;
    restaurantNameObserver = new MutationObserver(() => replaceRestaurantNameInTextNodes(name));
    restaurantNameObserver.observe(document.body, { childList: true, subtree: true, characterData: true });
  }
  let clockTimer = null;
  function renderRestaurantClock() {
    const clock = document.getElementById('restaurantClock');
    const period = document.getElementById('clockPeriod');
    const date = document.getElementById('restaurantDate');
    const timezoneLabel = document.getElementById('restaurantTimezone');
    const live = document.getElementById('clockLiveStatus');
    if (!clock || !period || !date) return;
    const profile = window.HALINA_RESTAURANT_PROFILE || {};
    const timezone = String(profile.timezone || '').trim();
    if (!timezone) {
      clock.textContent = '--:--'; period.textContent = '--';
      date.textContent = 'Waiting for restaurant settings';
      if (timezoneLabel) timezoneLabel.textContent = 'TIMEZONE NOT SET';
      if (live) live.innerHTML = '<span class="dot"></span> CONNECTING';
      return;
    }
    try {
      const now = new Date();
      const timeParts = new Intl.DateTimeFormat('en-US', {timeZone:timezone,hour:'2-digit',minute:'2-digit',hourCycle:'h12'}).formatToParts(now);
      const part = type => timeParts.find(item => item.type === type)?.value || '';
      clock.textContent = `${part('hour')}:${part('minute')}`;
      period.textContent = part('dayPeriod').toUpperCase();
      date.textContent = new Intl.DateTimeFormat('en-US',{timeZone:timezone,weekday:'short',month:'short',day:'numeric',year:'numeric'}).format(now);
      if (timezoneLabel) timezoneLabel.textContent = timezone.replace(/_/g,' ');
      const clockPanel = document.querySelector('.clock-panel');
      if (clockPanel) clockPanel.title = 'Restaurant timezone: ' + timezone;
      if (live) live.innerHTML = '<span class="dot"></span> LIVE';
    } catch (error) {
      console.warn('Invalid restaurant timezone:',timezone,error);
      clock.textContent='--:--:--'; period.textContent='--'; date.textContent='Check restaurant timezone setting';
      if (timezoneLabel) timezoneLabel.textContent='INVALID TIMEZONE';
      if (live) live.innerHTML='<span class="dot"></span> CHECK SETTINGS';
    }
  }
  function startRestaurantClock(){renderRestaurantClock();if(clockTimer)clearInterval(clockTimer);clockTimer=setInterval(renderRestaurantClock,1000);}
  function applyProfile(profile) {
    if (!profile) return;
    const appearance = profile.appearance_settings || {};
    const fontMap = {Inter:'Inter, "Segoe UI Variable", Segoe UI, Aptos, Arial, sans-serif',Roboto:'Roboto, Segoe UI, Arial, sans-serif',Poppins:'Poppins, Segoe UI, Arial, sans-serif',Montserrat:'Montserrat, Segoe UI, Arial, sans-serif',Lato:'Lato, Segoe UI, Arial, sans-serif'};
    const font = fontMap[appearance.font_family] || fontMap.Inter;
    const scale = Math.min(1.15, Math.max(0.9, Number(appearance.font_scale) || 1));
    const logoScale = Math.min(1.5, Math.max(0.8, Number(appearance.logo_scale) || 1.15));
    document.documentElement.style.setProperty('--restaurant-font-family', font);
    document.documentElement.style.setProperty('--restaurant-font-scale', String(scale));
    document.documentElement.style.setProperty('--restaurant-logo-scale', String(logoScale));
    const name = String(profile.name || '').trim();
    if (name) {
      document.body.classList.add('restaurant-profile-ready');
      document.querySelectorAll(NAME_SELECTORS.join(',')).forEach(el => setName(el, name));
      document.title = `${name} — Dispatcher`;
      replaceRestaurantNameInTextNodes(name);
      watchRestaurantName(name);
    }
    if (profile.logo_url) {
      if (LOGO_MODE === 'dispatcher') setDispatcherLogo(profile.logo_url);
      else document.querySelectorAll(NAME_SELECTORS.join(',')).forEach(el => setInlineLogo(el, profile.logo_url));
    }
    profile = window.HALINA_CONFIG.normalizeProfile(profile);
    window.HALINA_RESTAURANT_PROFILE = profile;
    renderRestaurantClock();
  }
  window.applyRestaurantBranding = applyProfile;
  window.addEventListener('restaurantprofileloaded', () => {
    if (typeof render === 'function' && Array.isArray(allOrders) && allOrders.length) render();
  });
  async function connect() {
    try {
      const response = await fetch(API + '?id=eq.' + RESTAURANT_ID + '&select=name,logo_url,address,contact_number,email,website,currency,timezone,tax_rate,appearance_settings', {
        headers: { apikey: KEY, Authorization: 'Bearer ' + KEY }, cache: 'no-store'
      });
      if (!response.ok) throw new Error('Profile request failed: ' + response.status);
      const rows = await response.json();
      const profile = rows && rows[0];
      if (!profile) return;
      applyProfile(profile);
      window.dispatchEvent(new CustomEvent('restaurantprofileloaded', { detail: profile }));
    } catch (error) { console.warn('Could not load centralized restaurant profile:', error); }
  }
  window.addEventListener('restaurantprofilechanged', e => applyProfile(e.detail));
  window.addEventListener('focus', connect);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) connect(); });
  startRestaurantClock();
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', connect, { once: true });
  else connect();
})();
</script>
